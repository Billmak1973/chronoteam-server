<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統配置管理 - ChronoTeam 管理中心</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/admin.css">
    <style>
        /* === 系統配置專屬樣式 === */
        .config-card {
            background: white;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0, 0, 0, 0.03);
            max-width: 700px;
            margin: 0 auto;
            overflow: hidden;
        }

        .config-card-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .config-card-header i {
            font-size: 1.5rem;
            color: var(--gold);
        }

        .config-card-header h3 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .config-card-body {
            padding: 2.5rem;
        }

        /* === Tab 导航样式 === */
        .config-tabs {
            display: flex;
            border-bottom: 2px solid #e9ecef;
            margin-bottom: 2rem;
        }

        .config-tab {
            padding: 1rem 2rem;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            color: var(--gray);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .config-tab:hover {
            color: var(--primary);
        }

        .config-tab.active {
            color: var(--primary);
            border-bottom-color: var(--gold);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* === 表单样式 === */
        .form-group {
            margin-bottom: 1.8rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.6rem;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group label i {
            color: var(--gold);
            width: 16px;
            text-align: center;
        }

        .form-input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            background: #fafafa;
            color: var(--primary);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--gold);
            background: white;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
        }

        .form-hint {
            display: block;
            margin-top: 0.5rem;
            color: var(--gray);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-save-config {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--gold) 0%, #b8972b 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            margin-top: 1rem;
        }

        .btn-save-config:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
            filter: brightness(1.05);
        }

        .btn-save-config:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .config-card-body {
                padding: 1.5rem;
            }

            .config-tab {
                padding: 0.8rem 1rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>
    <!-- 引入公共导航栏 -->
    <div th:replace="~{fragments/common :: navbar}"></div>

    <div class="admin-layout">
        <!-- 引入左侧边栏 (activePage 设为 'config') -->
        <div th:replace="~{fragments/admin-sidebar :: adminSidebar(activePage='config')}"></div>

        <!-- 右侧内容区 -->
        <main class="admin-main">
            <!-- 顶部标题与面包屑 -->
            <div class="content-header">
                <h2><i class="fas fa-cogs"></i> <span id="pageTitle">系统配置管理</span></h2>
                <div class="breadcrumb">
                    <a href="/admin/dashboard">管理中心</a> /
                    <a href="#">系统与权限管理</a> /
                    <span id="pageBreadcrumb">系统配置</span>
                </div>
            </div>

            <!-- 动态内容容器 -->
            <div class="content-body">
                <div class="config-card">
                    <div class="config-card-header">
                        <i class="fas fa-sliders-h"></i>
                        <h3>平台规则设置</h3>
                    </div>
                    <div class="config-card-body">
                        <!-- Tab 导航 -->
                        <div class="config-tabs">
                            <button class="config-tab active" onclick="switchConfigTab('shipping', this)">
                                <i class="fas fa-truck-fast"></i> 物流与运费
                            </button>
                            <button class="config-tab" onclick="switchConfigTab('return', this)">
                                <i class="fas fa-undo"></i> 退换货政策
                            </button>
                        </div>

                        <!-- Tab 1: 物流与运费设置 -->
                        <div id="tab-shipping" class="tab-content active">
                            <form id="shippingConfigForm" onsubmit="saveShippingConfig(event)">
                                <div class="form-group">
                                    <label for="shippingFee">
                                        <i class="fas fa-coins"></i> 基础快递费用 (HKD)
                                    </label>
                                    <input type="number" id="shippingFee" step="0.01" min="0" required
                                        class="form-input" placeholder="例如：50">
                                    <small class="form-hint">
                                        <i class="fas fa-info-circle"></i> 当订单未达到免邮门槛时，将向顾客收取此固定运费。
                                    </small>
                                </div>

                                <div class="form-group">
                                    <label for="freeShippingThreshold">
                                        <i class="fas fa-gift"></i> 免运费门槛 (HKD)
                                    </label>
                                    <input type="number" id="freeShippingThreshold" step="0.01" min="0" required
                                        class="form-input" placeholder="例如：30000">
                                    <small class="form-hint">
                                        <i class="fas fa-info-circle"></i> 例如填写 30000，则顾客订单总额满 3 万即可自动免除快递费。
                                    </small>
                                </div>

                                <button type="submit" class="btn-save-config" id="saveShippingBtn">
                                    <i class="fas fa-save"></i> 保存运费设置
                                </button>
                            </form>
                        </div>

                        <!-- Tab 2: 退换货政策设置 -->
                        <div id="tab-return" class="tab-content">
                            <form id="returnConfigForm" onsubmit="saveReturnConfig(event)">
                                <div class="form-group">
                                    <label for="returnDays">
                                        <i class="fas fa-calendar-alt"></i> 无条件退货天数
                                    </label>
                                    <input type="number" id="returnDays" step="1" min="0" max="30" required
                                        class="form-input" placeholder="例如：7">
                                    <small class="form-hint">
                                        <i class="fas fa-info-circle"></i> 顾客收货后可无条件申请退货的天数（0 表示不支持退货）。
                                    </small>
                                </div>

                                <div class="form-group">
                                    <label for="exchangeDays">
                                        <i class="fas fa-exchange-alt"></i> 无条件换货天数
                                    </label>
                                    <input type="number" id="exchangeDays" step="1" min="0" max="30" required
                                        class="form-input" placeholder="例如：14">
                                    <small class="form-hint">
                                        <i class="fas fa-info-circle"></i> 顾客收货后可无条件申请换货的天数（0 表示不支持换货）。
                                    </small>
                                </div>

                                <button type="submit" class="btn-save-config" id="saveReturnBtn">
                                    <i class="fas fa-save"></i> 保存退换货设置
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="admin-footer"
                style="margin-top: 3rem; padding: 2rem; background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); border-radius: 12px; text-align: center; color: rgba(255,255,255,0.7);">
                <p style="margin: 0; font-size: 0.9rem;">
                    <i class="fas fa-shield-alt" style="color: var(--gold); margin-right: 0.5rem;"></i>
                    &copy; <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2026</span>
                    ChronoTeam Admin Panel. All Rights Reserved.
                </p>
            </footer>
        </main>
    </div>

    <!-- 引入公共弹窗 -->
    <div th:replace="~{fragments/common :: modals}"></div>

    <!-- 注入登入状态 -->
    <script th:inline="javascript">
        const isLoggedIn = [[${#authorization.expression('isAuthenticated()')} ?: false]];
    </script>

    <script src="/js/common.js"></script>
    <script src="/js/admin.js"></script>

    <!-- 页面专属 JS -->
    <script>
        // 页面加载时，从后端获取当前配置并填充表单
        document.addEventListener('DOMContentLoaded', async function () {
            await loadAllConfigs();
        });

        // Tab 切换功能
        function switchConfigTab(tabName, btn) {
            // 隐藏所有 Tab 内容
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });

            // 移除所有 Tab 按钮的 active 状态
            document.querySelectorAll('.config-tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // 显示当前 Tab 内容
            document.getElementById('tab-' + tabName).classList.add('active');

            // 激活当前 Tab 按钮
            btn.classList.add('active');
        }

        // 加载所有配置
        async function loadAllConfigs() {
            try {
                const res = await fetch('/api/admin/config/get', {
                    method: 'GET',
                    credentials: 'same-origin'
                });

                if (res.ok) {
                    const configs = await res.json();

                    // 填充运费设置
                    if (configs.SHIPPING_FEE) {
                        document.getElementById('shippingFee').value = configs.SHIPPING_FEE;
                    }
                    if (configs.FREE_SHIPPING_THRESHOLD) {
                        document.getElementById('freeShippingThreshold').value = configs.FREE_SHIPPING_THRESHOLD;
                    }

                    // 填充退换货设置
                    if (configs.RETURN_DAYS !== undefined) {
                        document.getElementById('returnDays').value = configs.RETURN_DAYS;
                    }
                    if (configs.EXCHANGE_DAYS !== undefined) {
                        document.getElementById('exchangeDays').value = configs.EXCHANGE_DAYS;
                    }
                }
            } catch (error) {
                console.warn('加载当前配置失败:', error);
            }
        }

        // 保存运费设置
        async function saveShippingConfig(e) {
            e.preventDefault();

            const data = {
                "SHIPPING_FEE": document.getElementById('shippingFee').value,
                "FREE_SHIPPING_THRESHOLD": document.getElementById('freeShippingThreshold').value
            };

            await saveConfig('/api/admin/config/update-shipping', data, 'saveShippingBtn', '运费设置已成功保存！');
        }

        // 保存退换货设置
        async function saveReturnConfig(e) {
            e.preventDefault();

            const data = {
                "RETURN_DAYS": document.getElementById('returnDays').value,
                "EXCHANGE_DAYS": document.getElementById('exchangeDays').value
            };

            await saveConfig('/api/admin/config/update-return-policy', data, 'saveReturnBtn', '退换货政策已成功保存！');
        }

        // 通用保存配置函数
        async function saveConfig(url, data, btnId, successMessage) {
            const btn = document.getElementById(btnId);
            const originalText = btn.innerHTML;

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'same-origin',
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    const result = await res.json();
                    if (typeof showNotification === 'function') {
                        showNotification('✅ ' + (result.message || successMessage));
                    } else {
                        alert('✅ ' + (result.message || successMessage));
                    }
                } else {
                    const err = await res.json().catch(() => ({}));
                    if (typeof showNotification === 'function') {
                        showNotification(' ' + (err.message || '保存失败，请检查权限'), true);
                    } else {
                        alert('❌ 保存失败，请检查权限');
                    }
                }
            } catch (error) {
                console.error('保存配置错误:', error);
                if (typeof showNotification === 'function') {
                    showNotification('❌ 网络错误，请稍后重试', true);
                } else {
                    alert('❌ 网络错误，请稍后重试');
                }
            } finally {
                // 恢复按钮状态
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }
    </script>
</body>

</html>
