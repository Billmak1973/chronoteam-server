<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線下店鋪管理 - ChronoTeam 管理中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    /* ==========================================
       店鋪卡片樣式
       ========================================== */
    .store-card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 1.5rem;
        margin-top: 1.5rem;
    }
    .store-card {
        background: white;
        border-radius: 12px;
        box-shadow: var(--card-shadow);
        border: 1px solid rgba(0,0,0,0.03);
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        transition: var(--transition);
        position: relative;
        overflow: hidden;
    }
    .store-card:hover { transform: translateY(-5px); box-shadow: var(--card-hover-shadow); }
    .store-card.hidden-store { opacity: 0.6; border: 2px dashed #e9ecef; }
    .store-name { font-size: 1.25rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 0.5rem; }
    .store-name i { color: var(--gold); }
    .store-code { font-family: monospace; font-size: 0.85rem; background: #f1f3f5; color: #495057; padding: 0.2rem 0.6rem; border-radius: 4px; display: inline-block; width: fit-content; }
    .store-info { display: flex; flex-direction: column; gap: 0.6rem; color: var(--gray); font-size: 0.95rem; flex: 1; }
    .store-info div { display: flex; align-items: flex-start; gap: 0.6rem; }
    .store-info i { color: var(--gold); width: 16px; text-align: center; margin-top: 3px; }
    .store-actions { display: flex; gap: 0.8rem; margin-top: auto; padding-top: 1rem; border-top: 1px solid #f1f3f5; }
    .btn-store { flex: 1; padding: 0.6rem; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.4rem; font-size: 0.9rem; }
    .btn-edit { background: rgba(212, 175, 55, 0.1); color: var(--gold); }
    .btn-edit:hover { background: var(--gold); color: white; }
    .btn-toggle { background: rgba(23, 162, 184, 0.1); color: #17a2b8; }
    .btn-toggle:hover { background: #17a2b8; color: white; }
    .btn-toggle.is-hidden { background: rgba(108, 117, 125, 0.1); color: #6c757d; }
    .btn-toggle.is-hidden:hover { background: #6c757d; color: white; }
    .btn-delete { background: rgba(220, 53, 69, 0.1); color: #dc3545; }
    .btn-delete:hover { background: #dc3545; color: white; }
    .status-badge-store { position: absolute; top: 1rem; right: 1rem; padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .status-active { background: rgba(40, 167, 69, 0.15); color: #28a745; }
    .status-inactive { background: rgba(108, 117, 125, 0.15); color: #6c757d; }
    .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .modal-grid-full { grid-column: 1 / -1; }

    /* ==========================================
       【核心修復】：編輯彈窗樣式補全
       這些樣式原本只存在於 admin-products.html 的 <style> 中，
       admin.css / common.css 裡沒有，導致本頁的 Modal 失去
       display:none 而直接渲染在頁面上。現在補全到此頁面。
       ========================================== */
    .edit-modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        z-index: 2000;
        display: none;               /* ⭐ 關鍵：默認隱藏！ */
        justify-content: center;
        align-items: center;
        animation: fadeIn 0.3s ease;
    }
    .edit-modal-box {
        background: white;
        border-radius: 16px;
        width: 90%;
        max-width: 750px;
        max-height: 90vh;
        overflow-y: auto;
        padding: 2rem;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        border-top: 5px solid var(--gold);
    }
    .edit-modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 2px solid #f1f3f5;
    }
    .edit-modal-header h3 {
        margin: 0;
        color: var(--primary);
        font-size: 1.4rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    .edit-modal-header h3 i { color: var(--gold); }
    .modal-close-btn {
        background: none;
        border: none;
        font-size: 1.5rem;
        color: var(--gray);
        cursor: pointer;
        transition: color 0.3s;
        padding: 0.5rem;
    }
    .modal-close-btn:hover { color: var(--accent); }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: var(--primary);
        font-size: 0.9rem;
    }
    .form-group label i { color: var(--gold); width: 16px; text-align: center; }
    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 0.8rem 1rem;
        border: 2px solid #e9ecef;
        border-radius: 8px;
        font-size: 0.95rem;
        font-family: inherit;
        transition: all 0.3s ease;
        background: #fafafa;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: var(--gold);
        background: white;
        box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
    }
    .form-group small {
        display: block;
        margin-top: 0.4rem;
        color: var(--gray);
        font-size: 0.8rem;
    }
    .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 1rem;
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 2px solid #f1f3f5;
    }
    .btn-modal-cancel {
        padding: 0.8rem 1.5rem;
        background: #e9ecef;
        color: var(--primary);
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
    }
    .btn-modal-cancel:hover { background: #dee2e6; transform: translateY(-2px); }
    .btn-modal-save {
        padding: 0.8rem 2rem;
        background: linear-gradient(135deg, var(--gold) 0%, #b8972b 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    .btn-modal-save:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4); }
    .btn-modal-save:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp {
        from { opacity: 0; transform: translateY(40px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (max-width: 768px) {
        .modal-grid { grid-template-columns: 1fr; }
        .edit-modal-box { padding: 1.5rem; width: 95%; }
    }
  </style>
</head>
<body>
<div th:replace="~{fragments/common :: navbar}"></div>
<div class="admin-layout">
  <div th:replace="~{fragments/admin-sidebar :: adminSidebar(activePage='stores')}"></div>
  <main class="admin-main">
    <div class="content-header">
      <h2><i class="fas fa-store"></i> <span>線下店鋪管理</span></h2>
      <button class="btn btn-primary" onclick="openAddStoreModal()" style="white-space: nowrap;">
        <i class="fas fa-plus-circle"></i> 新增店鋪
      </button>
    </div>
    <div class="content-body">
      <div id="storeLoading" style="text-align: center; padding: 3rem; color: var(--gray);">
        <i class="fas fa-spinner fa-spin fa-2x"></i>
        <p style="margin-top: 1rem;">加載店鋪數據中...</p>
      </div>
      <div class="store-card-grid" id="storeGrid" style="display: none;"></div>
      <div id="storeEmpty" style="display: none; text-align: center; padding: 4rem 2rem; color: var(--gray);">
        <i class="fas fa-store-slash" style="font-size: 4rem; color: #e9ecef; margin-bottom: 1.5rem;"></i>
        <h3>暫無線下店鋪</h3>
        <p>點擊右上角「新增店鋪」按鈕添加您的第一家實體店鋪。</p>
      </div>
    </div>
  </main>
</div>

<!-- 新增/編輯 Modal（雙保險：額外加上 inline display:none） -->
<div id="storeModal" class="edit-modal-overlay" style="display: none;">
  <div class="edit-modal-box" style="max-width: 600px;">
    <div class="edit-modal-header">
      <h3><i class="fas fa-store"></i> <span id="modalTitle">新增店鋪</span></h3>
      <button class="modal-close-btn" onclick="closeStoreModal()">&times;</button>
    </div>
    <form id="storeForm" onsubmit="saveStore(event)">
      <input type="hidden" id="storeId">
      <div class="modal-grid">
        <div class="form-group">
          <label><i class="fas fa-barcode"></i> 店鋪代碼 (唯一標識)</label>
          <input type="text" id="storeCode" required placeholder="例如: store-central" pattern="[a-zA-Z0-9\-]+" title="僅允許字母、數字和連字符">
          <small style="color: var(--accent);">* 結帳系統依賴此代碼，新增後請勿隨意更改</small>
        </div>
        <div class="form-group">
          <label><i class="fas fa-signature"></i> 店鋪名稱</label>
          <input type="text" id="storeName" required placeholder="例如: 中環旗艦店">
        </div>
        <div class="form-group modal-grid-full">
          <label><i class="fas fa-map-marker-alt"></i> 詳細地址</label>
          <input type="text" id="storeAddress" required placeholder="例如: 中環皇后大道中 99 號">
        </div>
        <div class="form-group">
          <label><i class="fas fa-phone"></i> 聯繫電話</label>
          <input type="text" id="storePhone" placeholder="例如: +852 2123 4567">
        </div>
        <div class="form-group">
          <label><i class="fas fa-clock"></i> 營業時間</label>
          <input type="text" id="storeHours" placeholder="例如: 10:00 AM - 8:00 PM">
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-modal-cancel" onclick="closeStoreModal()">取消</button>
        <button type="submit" class="btn-modal-save" id="saveStoreBtn"><i class="fas fa-save"></i> 儲存</button>
      </div>
    </form>
  </div>
</div>

<div th:replace="~{fragments/common :: modals}"></div>

<script th:inline="javascript">
  const isLoggedIn = [[${ #authorization.expression('isAuthenticated()') } ?: false]];
</script>
<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
<script>
  let stores = [];
  document.addEventListener('DOMContentLoaded', loadStores);

  async function loadStores() {
      try {
          const res = await fetch('/admin/stores/api/list');
          if (res.ok) { stores = await res.json(); renderStores(); }
          else {
              // 接口失敗時也要隱藏 loading，避免卡在加載中
              document.getElementById('storeLoading').style.display = 'none';
              document.getElementById('storeEmpty').style.display = 'block';
          }
      } catch (e) {
          document.getElementById('storeLoading').style.display = 'none';
          document.getElementById('storeEmpty').style.display = 'block';
          showNotification('❌ 網絡錯誤', true);
      }
  }

  function renderStores() {
      const grid = document.getElementById('storeGrid');
      const loading = document.getElementById('storeLoading');
      const empty = document.getElementById('storeEmpty');
      loading.style.display = 'none';
      if (stores.length === 0) { grid.style.display = 'none'; empty.style.display = 'block'; return; }
      empty.style.display = 'none'; grid.style.display = 'grid'; grid.innerHTML = '';

      stores.forEach(store => {
          const card = document.createElement('div');
          card.className = `store-card ${!store.isActive ? 'hidden-store' : ''}`;
          card.innerHTML = `
              <span class="status-badge-store ${store.isActive ? 'status-active' : 'status-inactive'}">
                  <i class="fas fa-${store.isActive ? 'eye' : 'eye-slash'}"></i> ${store.isActive ? '顯示中' : '已隱藏'}
              </span>
              <div class="store-name"><i class="fas fa-store"></i> ${store.name}</div>
              <div class="store-code">${store.storeCode}</div>
              <div class="store-info">
                  <div><i class="fas fa-map-marker-alt"></i> <span>${store.address || '未填寫'}</span></div>
                  <div><i class="fas fa-phone"></i> <span>${store.phone || '未填寫'}</span></div>
                  <div><i class="fas fa-clock"></i> <span>${store.hours || '未填寫'}</span></div>
              </div>
              <div class="store-actions">
                  <button class="btn-store btn-edit" onclick="openEditStoreModal(${store.storeId})"><i class="fas fa-edit"></i> 編輯</button>
                  <button class="btn-store btn-toggle ${!store.isActive ? 'is-hidden' : ''}" onclick="toggleStore(${store.storeId})">
                      <i class="fas fa-${store.isActive ? 'eye-slash' : 'eye'}"></i> ${store.isActive ? '隱藏' : '顯示'}
                  </button>
                  <button class="btn-store btn-delete" onclick="deleteStore(${store.storeId})"><i class="fas fa-trash-alt"></i></button>
              </div>`;
          grid.appendChild(card);
      });
  }

  function openAddStoreModal() {
      document.getElementById('modalTitle').textContent = '新增店鋪';
      document.getElementById('storeForm').reset();
      document.getElementById('storeId').value = '';
      document.getElementById('storeModal').style.display = 'flex';
      document.body.style.overflow = 'hidden';
  }

  function openEditStoreModal(id) {
      const store = stores.find(s => s.storeId === id);
      if (!store) return;
      document.getElementById('modalTitle').textContent = '編輯店鋪';
      document.getElementById('storeId').value = store.storeId;
      document.getElementById('storeCode').value = store.storeCode;
      document.getElementById('storeName').value = store.name;
      document.getElementById('storeAddress').value = store.address;
      document.getElementById('storePhone').value = store.phone || '';
      document.getElementById('storeHours').value = store.hours || '';
      document.getElementById('storeModal').style.display = 'flex';
      document.body.style.overflow = 'hidden';
  }

  function closeStoreModal() {
      document.getElementById('storeModal').style.display = 'none';
      document.body.style.overflow = '';
  }

  async function saveStore(e) {
      e.preventDefault();
      const id = document.getElementById('storeId').value;
      const payload = {
          storeCode: document.getElementById('storeCode').value.trim(),
          name: document.getElementById('storeName').value.trim(),
          address: document.getElementById('storeAddress').value.trim(),
          phone: document.getElementById('storePhone').value.trim(),
          hours: document.getElementById('storeHours').value.trim()
      };
      const btn = document.getElementById('saveStoreBtn');
      const originalText = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 儲存中...';
      try {
          const url = id ? `/admin/stores/api/update/${id}` : '/admin/stores/api/add';
          const res = await fetch(url, { method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          const result = await res.json();
          if (res.ok) { showNotification('✅ ' + result.message); closeStoreModal(); loadStores(); }
          else { showNotification('❌ ' + (result.message || '操作失敗'), true); }
      } catch (err) { showNotification('❌ 網絡錯誤', true); }
      finally { btn.disabled = false; btn.innerHTML = originalText; }
  }

  async function toggleStore(id) {
      const res = await fetch(`/admin/stores/api/toggle/${id}`, { method: 'PUT' });
      const result = await res.json();
      if (res.ok) { showNotification('✅ ' + result.message); loadStores(); }
      else { showNotification('❌ ' + (result.message || '操作失敗'), true); }
  }

  async function deleteStore(id) {
      if (!confirm('確定要永久刪除此店鋪嗎？')) return;
      const res = await fetch(`/admin/stores/api/delete/${id}`, { method: 'DELETE' });
      const result = await res.json();
      if (res.ok) { showNotification('✅ ' + result.message); loadStores(); }
      else { showNotification('❌ ' + (result.message || '刪除失敗'), true); }
  }

  // 點擊遮罩層關閉
  document.getElementById('storeModal')?.addEventListener('click', function(e) { if (e.target === this) closeStoreModal(); });
  // ESC 鍵關閉
  document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
          const modal = document.getElementById('storeModal');
          if (modal && modal.style.display === 'flex') closeStoreModal();
      }
  });
</script>
</body>
</html>
