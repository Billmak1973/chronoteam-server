            // ==========================================
            // 【核心校驗 2】：狀態「變更為」 COMPLETED 時的必填檢查 (保留原有邏輯)
            // ==========================================
            const statusEl = form.querySelector('[name="status"]');
            const statusValue = statusEl ? statusEl.value.trim() : '';
            // 只有當原本不是 COMPLETED，且現在要改成 COMPLETED 時，才觸發此必填校驗
            const isChangingToCompleted = statusValue === 'COMPLETED' && !isAlreadyCompleted;

            if (isChangingToCompleted) {
                const appraiserIdEl = form.querySelector('[name="appraiserId"]');
                const finalPriceEl = form.querySelector('[name="finalPrice"]');

                if (!appraiserIdEl || !appraiserIdEl.value.trim()) {
                    if (typeof showNotification === 'function') {
                        showNotification('❌ 狀態為「已完成」時，負責鑑定師不能為空！', true);
                    } else {
                        alert('❌ 狀態為「已完成」時，負責鑑定師不能為空！');
                    }
                    return; // 攔截提交
                }

                if (!finalPriceEl || !finalPriceEl.value.trim()) {
                    if (typeof showNotification === 'function') {
                        showNotification('❌ 狀態為「已完成」時，最終成交價不能為空！', true);
                    } else {
                        alert('❌ 狀態為「已完成」時，最終成交價不能為空！');
                    }
                    return; // 攔截提交
                }
            }

            const fd = new FormData();

            // ===== 文字欄位 =====
            ['brand', 'series', 'model', 'purchaseYear', 'quantity', 'condition', 'functionStatus',
                'status', 'estimatedPrice', 'finalPrice', 'appraisalNotes', 'appraiserId', 'productId'].forEach(key => {
                    const el = form.querySelector(`[name="${key}"]`);
                    if (el) fd.append(key, el.value);
                });

            // ===== 圖片：舊圖最終歸屬 (含移動結果) =====
            const existingMap = {};
            Object.entries(pendingImages).forEach(([slot, v]) => {
                if (v.kind === 'existing') existingMap[slot] = v.path;
            });
            fd.append('imageMapJson', JSON.stringify(existingMap));

            // ===== 圖片：新上傳/更換的檔案 (key = 欄位名) =====
            Object.entries(pendingImages).forEach(([slot, v]) => {
                if (v.kind === 'new') fd.append(slot, v.file);
            });

            try {
                const res = await fetch(`/admin/api/sell-applications/${window.currentEditingApp.applicationId}`, {
                    method: 'PUT',
                    body: fd
                });
                const result = await res.json();
                if (result.success) {

                    else alert('✅ 儲存成功！');

                    if (typeof showNotification === 'function') showNotification('❌ ' + (result.message || '儲存失敗'), true);
                    else alert('❌ ' + (result.message || '儲存失敗'));
                }
            } catch (err) {
                console.error(err);
                if (typeof showNotification === 'function') showNotification('❌ 網絡錯誤', true);
                else alert('❌ 網絡錯誤');
            }
        }

        // 3. 加載商品列表（用於創建申請）
        async function loadCreateProducts() {
            const brand = document.getElementById('createBrandInput').value.trim();
            const optionsContainer = document.getElementById('createProductDropdownOptions');

            if (!brand) {
                optionsContainer.innerHTML = '<div style="padding: 1rem; text-align: center; color: var(--gray);">請先輸入品牌</div>';
                document.getElementById('createProductDropdownText').textContent = '請先選擇品牌';

            }

            optionsContainer.innerHTML = '<div style="padding: 1rem; text-align: center; color: var(--gold);"><i class="fas fa-spinner fa-spin"></i> 載入中...</div>';

            try {
                const response = await fetch(`/brands/${encodeURIComponent(brand)}`);
                const result = await response.json();
                if (result.success && result.data) {
                    if (result.data.length === 0) {
                        optionsContainer.innerHTML = '<div style="padding: 1rem; text-align: center; color: var(--gray);">該品牌下暫無商品</div>';
                        document.getElementById('createProductDropdownText').textContent = '該品牌下暫無商品';
                    } else {
                        // 生成選項 HTML (使用 data 屬性避免引號轉義問題)
                        let html = `<div class="custom-dropdown-option"
                         data-product-id=""
                         data-display-text="尚未分配 (清空關聯)"
                         onclick="selectCreateProductByElement(this)">
                         尚未分配 (清空關聯)
                     </div>`;

                        result.data.forEach(product => {
                            const displayText = `${product.description} (ID: ${product.productId})`;

                            // 使用 data 屬性存儲數據，只需轉義雙引號
                            html += `<div class="custom-dropdown-option"
                             data-product-id="${product.productId}"
                             data-display-text="${displayText.replace(/"/g, '&quot;')}"
                             onclick="selectCreateProductByElement(this)">
                            ${product.description} (HK$ ${product.price})
                         </div>`;
                        });
                        optionsContainer.innerHTML = html;
                        document.getElementById('createProductDropdownText').textContent = '請選擇商品';
                    }
                } else {
                    optionsContainer.innerHTML = '<div style="padding: 1rem; text-align: center; color: var(--gray);">載入失敗</div>';
                }
            } catch (e) {
                console.error('載入商品失敗', e);
                optionsContainer.innerHTML = '<div style="padding: 1rem; text-align: center; color: var(--gray);">網絡錯誤</div>';

        /**

         */
        async function loadStores() {
            try {
                const response = await fetch('/admin/stores/api/stores/available');
                const result = await response.json();

                    loadedStores = result.data;
                    const select = document.getElementById('modalStoreIdSelect');

                        // 渲染門店下拉選單

                            option.textContent = store.name;
                            select.appendChild(option);
                        });
                    }

        /**
         * 2. 門店信息與日期限制更新 (選擇門店時觸發)
         */
        window.updateStoreInfo = function (storeId) {
            const store = loadedStores.find(s => s.storeId == storeId);
            const infoBox = document.getElementById('modalStoreInfoBox');
            const infoList = document.getElementById('modalStoreInfoList');
            const dateInput = document.getElementById('modalAppointmentDate');
            const timeInput = document.getElementById('modalAppointmentTimeSlot');
            const hintBox = document.getElementById('modalAppointmentTimeHint');

            if (!store) {
                // 若未選擇門店，禁用並清空日期和時間
                if (infoBox) infoBox.style.display = 'none';
                if (dateInput) {dateInput.disabled = true; dateInput.value = '';}
                if (timeInput) {timeInput.disabled = true; timeInput.value = '';}
                if (hintBox) hintBox.style.display = 'none';
                return;
            }

            // 1. 解析營業時間 (統一營業 或 每日分別設置)
            let hoursText = '未設置';
            if (store.scheduleMode === 'UNIFIED') {
                hoursText = `統一營業時間：${store.hours || '未設置'}`;
            } else if (store.scheduleMode === 'DAILY' && store.dailyHours) {
                try {
                    const daily = JSON.parse(store.dailyHours);
                    const today = new Date().getDay();
                    const dayKey = today === 0 ? 7 : today; // 將週日(0)轉為7
                    const dayData = daily[dayKey];
                    if (dayData && !dayData.closed) {
                        hoursText = `今日營業時間：${dayData.start} - ${dayData.end}`;
                    } else {
                        hoursText = `今日店鋪休息`;
                    }
                } catch (e) {
                    hoursText = '營業時間解析錯誤';
                }
            }

            // 2. 組裝提示 HTML (已移除提前預約天數的提示)
            let rulesHtml = `<li><i class="fas fa-clock"></i> ${hoursText}</li>`;

            const todayStr = new Date().toISOString().split('T')[0];
            if (store.returnBlackoutStartDate && store.returnBlackoutEndDate) {
                if (todayStr >= store.returnBlackoutStartDate && todayStr <= store.returnBlackoutEndDate) {
                    rulesHtml += `<li style="color: #dc3545;"><i class="fas fa-ban"></i> 暫停預約： ${store.returnBlackoutStartDate} 至 ${store.returnBlackoutEndDate} (${store.returnBlackoutReason || '店鋪盤點/假期'})</li>`;
                }
            }

            if (infoList) infoList.innerHTML = rulesHtml;
            if (infoBox) infoBox.style.display = 'block';

            // 3. 設置日期輸入限制 (啟用日期框，並計算 min 日期為今天)
            if (dateInput) {
                dateInput.disabled = false;
                dateInput.value = '';
                // 最小日期設為今天
                dateInput.min = todayStr;
            }

            // 先禁用時間框，等日期選好再啟用
            if (timeInput) {
                timeInput.disabled = true;
                timeInput.value = '';
            }
            if (hintBox) hintBox.style.display = 'none';
        };

        /**
         * 3. 時間槽動態驗證與限制 (選擇日期時觸發)
         */
        window.updateTimeSlots = function () {
            const storeId = document.getElementById('modalStoreIdSelect').value;
            const selectedDateStr = document.getElementById('modalAppointmentDate').value;
            const timeInput = document.getElementById('modalAppointmentTimeSlot');
            const hintBox = document.getElementById('modalAppointmentTimeHint');
            const hintText = document.getElementById('modalAppointmentTimeHintText');

            if (!storeId || !selectedDateStr) {
                if (timeInput) {timeInput.disabled = true; timeInput.value = '';}
                if (hintBox) hintBox.style.display = 'none';
                return;
            }

            const store = loadedStores.find(s => s.storeId == storeId);
            const selectedDate = new Date(selectedDateStr);
            const dayOfWeek = selectedDate.getDay() === 0 ? 7 : selectedDate.getDay(); // 1-7

            // 【校驗 1】：檢查店鋪在該星期幾是否營業
            let isStoreOpenOnThisDay = false;
            let daySchedule = null;
            if (store.scheduleMode === 'DAILY' && store.dailyHours) {
                try {
                    const daily = JSON.parse(store.dailyHours);
                    daySchedule = daily[dayOfWeek];
                    if (daySchedule && !daySchedule.closed) {
                        isStoreOpenOnThisDay = true;
                    } else {
                        if (hintBox && hintText) {
                            hintBox.style.display = 'block';
                            hintText.innerHTML = `⚠️ 該店鋪在星期${dayOfWeek === 7 ? '日' : dayOfWeek}休息，無法預約！`;
                            hintText.style.color = '#dc3545';
                        }
                        if (timeInput) {timeInput.disabled = true; timeInput.value = '';}
                        return;
                    }
                } catch (e) {
                    console.error('解析每日營業時間失敗:', e);
                }
            } else if (store.scheduleMode === 'UNIFIED' && store.hours) {
                isStoreOpenOnThisDay = true;
            }

            if (!isStoreOpenOnThisDay) return;

            // 【校驗 2】：檢查是否在固定休息日 (returnClosedDaysOfWeek)
            if (store.returnClosedDaysOfWeek) {
                const closedDays = String(store.returnClosedDaysOfWeek).split(',').map(d => parseInt(d.trim()));
                if (closedDays.includes(dayOfWeek)) {
                    if (hintBox && hintText) {
                        hintBox.style.display = 'block';
                        hintText.innerHTML = `⚠️ 該日為店鋪固定休息日（星期${dayOfWeek === 7 ? '日' : dayOfWeek}），無法預約！`;
                        hintText.style.color = '#dc3545';
                    }
                    if (timeInput) {timeInput.disabled = true; timeInput.value = '';}
                    return;
                }
            }

            // 【校驗 3】：檢查是否處於暫停售後期間
            if (store.returnBlackoutStartDate && store.returnBlackoutEndDate) {
                if (selectedDateStr >= store.returnBlackoutStartDate && selectedDateStr <= store.returnBlackoutEndDate) {
                    if (hintBox && hintText) {
                        hintBox.style.display = 'block';
                        hintText.innerHTML = `⚠️ 該日期為暫停預約期間 (${store.returnBlackoutStartDate} 至 ${store.returnBlackoutEndDate})，無法預約！`;
                        hintText.style.color = '#dc3545';
                    }
                    if (timeInput) {timeInput.disabled = true; timeInput.value = '';}
                    return;
                }
            }

            // 【校驗 4】：獲取該日的營業時間並轉換為 24 小時制
            let startTime = '09:00', endTime = '19:00'; // 默認值
            if (store.scheduleMode === 'UNIFIED' && store.hours) {
                const times = parseBusinessHours(store.hours);
                if (times) {startTime = times.start; endTime = times.end;}
            } else if (store.scheduleMode === 'DAILY' && daySchedule) {
                const times = parseBusinessHours(`${daySchedule.start} - ${daySchedule.end}`);
                if (times) {startTime = times.start; endTime = times.end;}
            }

            // 設置 input type="time" 的 min 和 max 屬性，啟用輸入框
            if (timeInput) {
                timeInput.disabled = false;
                timeInput.min = startTime;
                timeInput.max = endTime;
            }

            // 觸發一次實時驗證以顯示提示
            validateTimeInput();
        };

        /**
         * 4. 實時時間驗證 (輸入時間時觸發)
         */
        window.validateTimeInput = function () {
            const timeInput = document.getElementById('modalAppointmentTimeSlot');
            const hintBox = document.getElementById('modalAppointmentTimeHint');
            const hintText = document.getElementById('modalAppointmentTimeHintText');

            if (!timeInput) return;

            const startTime = timeInput.min;
            const endTime = timeInput.max;

            timeInput.classList.remove('time-input-error'); // 重置狀態

            if (!timeInput.value) {
                if (hintBox && hintText) {
                    hintBox.style.display = 'block';
                    hintText.innerHTML = `營業時間：${formatTimeDisplay(startTime)} 至 ${formatTimeDisplay(endTime)}`;
                    hintText.style.color = '#6c757d';
                }
                return;
            }

            // 檢查時間是否超出範圍
            if (timeInput.value < startTime || timeInput.value > endTime) {
                timeInput.classList.add('time-input-error'); // 添加紅色邊框和抖動動畫 (需在CSS中定義 .time-input-error)
                if (hintBox && hintText) {
                    hintBox.style.display = 'block';
                    hintText.innerHTML = `⚠️ 預約時間不得早於 ${formatTimeDisplay(startTime)} 或晚於 ${formatTimeDisplay(endTime)}！`;
                    hintText.style.color = '#dc3545';
                }
            } else {
                // 時間合法
                if (hintBox && hintText) {
                    hintBox.style.display = 'block';
                    hintText.innerHTML = `✓ 有效時間：${formatTimeDisplay(startTime)} 至 ${formatTimeDisplay(endTime)}`;
                    hintText.style.color = '#28a745';
                }
            }
        };

        /**
         * 5. 輔助函數：時間格式轉換
         */
        function parseBusinessHours(hoursStr) {
            const parts = hoursStr.split('-');
            if (parts.length === 2) {
                return {
                    start: convertTo24Hour(parts[0].trim()),
                    end: convertTo24Hour(parts[1].trim())
                };
            }
            return null;
        }

        function convertTo24Hour(timeStr) {
            const match = timeStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
            if (!match) return "10:00";
            let hours = parseInt(match[1]);
            const mins = match[2];
            const period = match[3].toUpperCase();
            if (period === 'PM' && hours !== 12) hours += 12;
            if (period === 'AM' && hours === 12) hours = 0;
            return `${String(hours).padStart(2, '0')}:${mins}`;
        }

        function formatTimeDisplay(time24) {
            const [hours, minutes] = time24.split(':');
            let h = parseInt(hours);
            const period = h >= 12 ? 'P.M.' : 'A.M.';
            h = h % 12 || 12;
            return `${String(h).padStart(2, '0')}:${minutes} ${period}`;
        }

        // 點擊遮罩層關閉 Modal
        document.getElementById('receiveItemModal')?.addEventListener('click', function (e) {
            if (e.target === this) {
                closeReceiveItemModal();
            }
        });

        // ESC 鍵關閉 Modal
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                const modal = document.getElementById('receiveItemModal');
                if (modal && modal.style.display === 'flex') {
                    closeReceiveItemModal();
                }
            }
        });
        // ==========================================
        // 5. 全局事件：遮罩點擊 + ESC 關閉彈窗
        // ==========================================
        document.getElementById('detailModal').addEventListener('click', function (e) {
            if (e.target === this) closeDetailModal();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                const modal = document.getElementById('detailModal');
                if (modal && modal.style.display === 'flex') closeDetailModal();
            }
        });

        // ==========================================
        // 6. 頁面初始化
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            // 初始化 AdminTable
            AdminTable.loadData(tableConfig);
        });

        // ==========================================
        // 【核心修復】：使用事件委託阻止數字輸入框響應鼠標滾輪
        // 這樣無論 input 是何時動態生成的，都能被成功攔截
        // ==========================================
        document.addEventListener('wheel', function (e) {
            // 檢查觸發事件的目標元素是否是帶有 .no-spin 類的數字輸入框
            if (e.target && e.target.matches('input[type="number"].no-spin')) {
                e.preventDefault(); // 阻止滾輪默認的加減行為
            }
        }, {passive: false}); // 必須設置為 false 才能調用 preventDefault()
    </script>
</body>
