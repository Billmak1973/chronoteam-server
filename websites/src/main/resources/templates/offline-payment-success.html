<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>訂單已創建 - ChronoTeam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/common.css">
    <style>
        /* ========================================== */
        /* ========== 基礎樣式 (白天模式) ========== */
        /* ========================================== */
        .success-container {
            max-width: 600px;
            margin: 5rem auto;
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            transition: all 0.5s ease;
        }

        .success-icon {
            font-size: 5rem;
            color: var(--gold);
            margin-bottom: 1.5rem;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .order-no {
            background: var(--light);
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 1.2rem;
            color: var(--primary);
            margin: 1.5rem 0;
            transition: all 0.5s ease;
        }

        .store-info {
            text-align: left;
            background: #fff3cd;
            padding: 1.5rem;
            border-radius: 8px;
            margin: 1.5rem 0;
            color: #856404;
            transition: all 0.5s ease;
        }

        .store-info p {
            margin-bottom: 0.5rem;
        }

        .action-btns {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }

        /* ========================================== */
        /* ========== 晚上模式 (Night Mode) ========== */
        /* ========================================== */
        body.night-mode {
            background: linear-gradient(180deg, #0a0e27 0%, #0f1535 50%, #16213e 100%) !important;
            background-attachment: fixed;
            color: #e0e0e0;
        }

        body.night-mode .success-container {
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.95) 0%, rgba(22, 33, 62, 0.95) 100%);
            border: 1px solid rgba(0, 212, 255, 0.15);
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.1);
        }

        body.night-mode .success-icon {
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        body.night-mode h2 {
            color: #ffffff !important;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        body.night-mode p {
            color: #b0b8c4 !important;
        }

        body.night-mode .order-no {
            background: rgba(0, 212, 255, 0.05);
            color: #00d4ff;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        body.night-mode .store-info {
            background: rgba(0, 212, 255, 0.08);
            color: #00d4ff;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        body.night-mode .store-info strong {
            color: #ffffff;
        }

        body.night-mode div[style*="background: #e2e3e5"] {
            background: rgba(255, 255, 255, 0.05) !important;
            color: #e0e0e0 !important;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ========================================== */
        /* ========== 七夕模式 (Qixi Mode) ========== */
        /* ========================================== */
        body.qixi-mode {
            background: linear-gradient(180deg, #2d1b2e 0%, #4a1942 50%, #1a1a2e 100%) !important;
            background-attachment: fixed;
            color: #f8f9fa;
        }

        /* 七夕模式漂浮愛心背景動畫 (可選) */
        body.qixi-mode::before {
            content: '❤';
            position: fixed;
            font-size: 2rem;
            color: rgba(255, 107, 129, 0.1);
            animation: floatHeart 8s ease-in-out infinite;
            top: 20%;
            left: 10%;
            pointer-events: none;
            z-index: 0;
        }
        body.qixi-mode::after {
            content: '❤';
            position: fixed;
            font-size: 3rem;
            color: rgba(255, 107, 129, 0.08);
            animation: floatHeart 10s ease-in-out infinite reverse;
            bottom: 20%;
            right: 15%;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes floatHeart {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.3; }
            50% { transform: translateY(-20px) rotate(10deg); opacity: 0.6; }
        }

        body.qixi-mode .success-container {
            background: linear-gradient(135deg, rgba(74, 25, 66, 0.9) 0%, rgba(45, 27, 46, 0.9) 100%);
            border: 1px solid rgba(255, 159, 243, 0.3);
            box-shadow: 0 10px 40px rgba(255, 107, 129, 0.15);
        }

        body.qixi-mode .success-icon {
            color: #ff9ff3;
            text-shadow: 0 0 20px rgba(255, 159, 243, 0.5);
        }

        body.qixi-mode h2 {
            color: #ffffff !important;
            text-shadow: 0 0 10px rgba(255, 159, 243, 0.3);
        }

        body.qixi-mode p {
            color: #f8e1e7 !important;
        }

        body.qixi-mode .order-no {
            background: rgba(255, 159, 243, 0.1);
            color: #ff9ff3;
            border: 1px solid rgba(255, 159, 243, 0.3);
        }

        body.qixi-mode .store-info {
            background: rgba(255, 107, 129, 0.1);
            color: #ff9ff3;
            border: 1px solid rgba(255, 159, 243, 0.3);
        }

        body.qixi-mode .store-info strong {
            color: #ffffff;
        }

        body.qixi-mode div[style*="background: #e2e3e5"] {
            background: rgba(255, 255, 255, 0.05) !important;
            color: #f8e1e7 !important;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<!-- 【核心修改】：根據後端傳入的 cardTheme 動態添加 class -->
<body th:classappend="${cardTheme == 'night'} ? 'night-mode' : (${cardTheme == 'qixi'} ? 'qixi-mode' : '')">
<div th:replace="~{fragments/common :: navbar}"></div>

<div class="success-container">
    <div class="success-icon"><i class="fas fa-store"></i></div>
    <h2 style="margin-bottom: 0.5rem;">訂單已創建！</h2>
    <p>請在 7 天內前往選定店鋪完成支付，逾期訂單將自動取消。</p>

    <div class="order-no">
        訂單編號：<span th:text="${data.orderNo}">ORD-XXX</span>
    </div>

    <div class="store-info">
        <h4 style="margin-bottom: 1rem;"><i class="fas fa-map-marker-alt"></i> 店鋪信息</h4>
        <p><strong>店鋪名稱：</strong><span th:text="${data.storeName}">中環店</span></p>
        <p><strong>店鋪地址：</strong><span th:text="${data.storeAddress}">中環皇后大道中 99 號</span></p>
        <p><strong>聯繫電話：</strong><span th:text="${data.storePhone}">+852 2123 4567</span></p>
        <p>
            <strong><i class="fas fa-calendar-check" style="margin-right: 4px;"></i>預約到店日期：</strong>
            <span th:text="${data.appointmentDate}" style="font-weight: 700;">2026年09月10日</span>
        </p>
    </div>

    <div style="background: #e2e3e5; padding: 1rem; border-radius: 8px; font-size: 0.9rem; text-align: left;">
        <strong><i class="fas fa-info-circle"></i> 到店支付須知：</strong>
        <ul style="margin: 0.5rem 0 0 1.5rem;">
            <li>請向店員出示您的訂單編號。</li>
            <li>支持現金、信用卡、銀行轉帳等多種支付方式。</li>
            <li>支付完成後，店員會即時更新訂單狀態。</li>
        </ul>
    </div>

    <div class="action-btns">
        <a href="/account/orders" class="btn btn-outline"><i class="fas fa-box"></i> 查看我的訂單</a>
        <a href="/" class="btn btn-primary"><i class="fas fa-home"></i> 返回首頁</a>
    </div>
</div>

<footer class="footer">
    <p>&copy; <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2026</span> ChronoTeam. All
        Rights Reserved.</p>
</footer>

<div th:replace="~{fragments/common :: modals}"></div>
<script th:inline="javascript">
    const isLoggedIn = [[${ #authorization.expression('isAuthenticated()') } ?: false]];
</script>
<script src="/js/common.js"></script>
</body>

</html>
