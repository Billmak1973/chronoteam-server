<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帳戶信息 - ChronoTeam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!--  1. 引入公共 CSS -->
    <link rel="stylesheet" href="/css/common.css">
    <!--  2. 引入側邊欄專屬 CSS -->
    <link rel="stylesheet" href="/css/sidebar.css">

    <!--  3. 頁面特有 CSS -->
    <style>
        :root {
            --primary-color: #1a1a2e;
            --secondary-color: #16213e;
            --accent-color: #e94560;
            --gold-color: #d4af37;
            --gold-light: #f4e4ba;
            --gold-dark: #b8941f;
            --success-color: #10b981;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --bg-primary: #ffffff;
            --bg-secondary: #f9fafb;
            --border-color: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --radius-sm: 0.5rem;
            --radius-md: 0.75rem;
            --radius-lg: 1rem;
            --radius-xl: 1.5rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* 主容器布局 */
        .dashboard-container {
            display: flex;
            min-height: calc(100vh - 80px);
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            gap: 2rem;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 主内容区域 */
        .main-content {
            flex: 1;
            background: var(--bg-primary);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            padding: 2.5rem;
            position: relative;
            overflow: hidden;
        }

        .main-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--gold-color) 0%, var(--accent-color) 100%);
        }

        /* 页面标题 */
        h2 {
            color: var(--primary-color);
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
            position: relative;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 60px;
            height: 2px;
            background: var(--gold-color);
        }

        h2 i {
            color: var(--gold-color);
            font-size: 2.2rem;
            background: linear-gradient(135deg, var(--gold-color) 0%, var(--gold-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 信息卡片容器 */
        .info-card {
            margin-top: 2rem;
        }

        /* 信息行 */
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            margin-bottom: 1rem;
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            border: 2px solid transparent;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .info-row::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--gold-color);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .info-row:hover {
            border-color: var(--gold-light);
            transform: translateX(5px);
            box-shadow: var(--shadow-md);
            background: linear-gradient(135deg, #ffffff 0%, var(--bg-secondary) 100%);
        }

        .info-row:hover::before {
            transform: scaleY(1);
        }

        /* 信息标签 */
        .info-label {
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.95rem;
        }

        .info-label i {
            color: var(--gold-color);
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        /* 信息值 */
        .info-value {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 1.05rem;
        }

        /* 操作组 */
        .info-action-group {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
            justify-content: flex-end;
        }

        /* 查看模式和编辑模式 */
        .view-mode,
        .edit-mode {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .edit-mode {
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* 表单输入框 */
        .form-input {
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 1rem;
            color: var(--text-primary);
            background: white;
            transition: all 0.3s ease;
            width: 280px;
            max-width: 100%;
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--gold-color);
            background: white;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
            transform: translateY(-1px);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.7;
        }

        /* 按钮图标 */
        .btn-icon {
            background: white;
            border: 2px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.6rem 0.8rem;
            border-radius: var(--radius-md);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }

        .btn-icon::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--gold-color) 0%, var(--gold-light) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 0;
        }

        .btn-icon>* {
            position: relative;
            z-index: 1;
        }

        .btn-icon:hover {
            color: var(--gold-dark);
            border-color: var(--gold-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.25);
        }

        .btn-icon:hover::before {
            opacity: 0.1;
        }

        .btn-icon i {
            font-size: 0.95rem;
        }

        .btn-add {
            color: var(--text-primary);
            border-style: dashed;
        }

        .btn-add:hover {
            border-color: var(--gold-color);
            color: var(--gold-color);
            background: rgba(212, 175, 55, 0.05);
        }

        /* 操作按钮 */
        .btn-action {
            padding: 0.6rem 1.5rem;
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        .btn-action::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-action:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-save {
            background: linear-gradient(135deg, var(--gold-color) 0%, var(--gold-dark) 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        .btn-save:active {
            transform: translateY(0);
        }

        .btn-cancel {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 2px solid var(--border-color);
        }

        .btn-cancel:hover {
            background: white;
            border-color: var(--text-secondary);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        /* 地址选择器组 */
        .address-selector-group {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
            flex: 1;
        }

        .address-select {
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
            color: var(--text-primary);
            font-family: inherit;
        }

        .address-select:focus {
            outline: none;
            border-color: var(--gold-color);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
        }

        .address-select:disabled {
            background: var(--bg-secondary);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .address-input-wrapper {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex: 1;
        }

        /* 返回按钮 */
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            margin-top: 2.5rem;
            padding: 0.875rem 2rem;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            text-decoration: none;
            border-radius: var(--radius-lg);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            font-size: 1rem;
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
        }

        .btn-back::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn-back:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
            background: linear-gradient(135deg, var(--gold-color) 0%, var(--gold-dark) 100%);
        }

        .btn-back:hover::before {
            left: 100%;
        }

        /* 自定义弹窗 */
        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .custom-modal-box {
            background: white;
            padding: 2.5rem;
            border-radius: var(--radius-xl);
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: var(--shadow-xl);
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .custom-modal-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--gold-color) 0%, var(--accent-color) 100%);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-color) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .modal-icon i {
            font-size: 2.5rem;
            color: white;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .btn-modal-primary {
            background: linear-gradient(135deg, var(--gold-color) 0%, var(--gold-dark) 100%);
            color: white;
            border: none;
            padding: 0.875rem 2rem;
            border-radius: var(--radius-lg);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .btn-modal-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        .btn-modal-secondary {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 2px solid var(--border-color);
            padding: 0.875rem 2rem;
            border-radius: var(--radius-lg);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-modal-secondary:hover {
            background: white;
            border-color: var(--text-secondary);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        /* 地址预览框 */
        .address-preview-box {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, white 100%);
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            margin: 1.5rem 0;
            text-align: left;
        }

        .preview-row {
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }

        .preview-row:last-child {
            margin-bottom: 0;
        }

        .preview-label {
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .preview-value {
            color: var(--text-primary);
            font-weight: 700;
            font-size: 1.1rem;
            padding: 0.5rem;
            background: white;
            border-radius: var(--radius-md);
            border-left: 3px solid var(--gold-color);
        }

        /* 居中提示弹窗 */
        .center-toast-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .center-toast-box {
            background: white;
            padding: 2.5rem 3rem;
            border-radius: var(--radius-xl);
            text-align: center;
            box-shadow: var(--shadow-xl);
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            min-width: 350px;
            max-width: 450px;
            border-top: 5px solid var(--gold-color);
        }

        .center-toast-box.toast-error {
            border-top-color: var(--error-color);
        }

        .center-toast-box.toast-error .center-toast-icon {
            color: var(--error-color);
            background: linear-gradient(135deg, #fecaca 0%, var(--error-color) 100%);
        }

        .center-toast-box.toast-success {
            border-top-color: var(--success-color);
        }

        .center-toast-box.toast-success .center-toast-icon {
            color: var(--success-color);
            background: linear-gradient(135deg, #d1fae5 0%, var(--success-color) 100%);
        }

        .center-toast-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-color) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
            animation: bounce 0.6s ease;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .center-toast-icon i {
            font-size: 3rem;
            color: white;
        }

        .center-toast-message {
            font-size: 1.2rem;
            color: var(--text-primary);
            font-weight: 600;
            line-height: 1.6;
        }

        /* 页脚 */
        .footer {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: rgba(255, 255, 255, 0.8);
            padding: 2rem;
            text-align: center;
            margin-top: 3rem;
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .dashboard-container {
                flex-direction: column;
            }

            .main-content {
                padding: 2rem;
            }
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 1.5rem;
            }

            .info-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .info-action-group {
                flex-direction: column;
                align-items: stretch;
                width: 100%;
            }

            .form-input {
                width: 100%;
            }

            .address-selector-group {
                flex-direction: column;
                width: 100%;
            }

            .address-select {
                width: 100%;
            }

            .address-input-wrapper {
                flex-direction: column;
                width: 100%;
            }

            h2 {
                font-size: 1.5rem;
            }

            .center-toast-box {
                min-width: auto;
                padding: 2rem;
            }
        }

        /* 加载动画 */
        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }

            100% {
                background-position: 1000px 0;
            }
        }

        .loading {
            animation: shimmer 2s infinite linear;
            background: linear-gradient(to right, var(--bg-secondary) 4%, var(--border-color) 25%, var(--bg-secondary) 36%);
            background-size: 1000px 100%;
        }

        /* 禁用状态 */
        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-action:disabled::before {
            display: none;
        }
    </style>
</head>

<body>

    <!--  引入公共导航栏 -->
    <div th:replace="~{fragments/common :: navbar}"></div>

    <!--  4. 使用 Flex 佈局容器 -->
    <div class="dashboard-container">

        <!--  5. 引入側邊欄 Fragment，並傳入 activePage='profile' 以高亮「帳戶信息」菜單 -->
        <div th:replace="~{fragments/sidebar :: sidebar(activePage='profile')}"></div>

        <!--  6. 右側主內容 (已替換為支援內聯編輯的版本) -->
        <main class="main-content">
            <h2><i class="fas fa-id-card" style="color: var(--gold);"></i> 帳戶信息</h2>
            <div class="info-card">

                <!-- 用戶名 (始終可編輯) -->
                <div class="info-row">
                    <span class="info-label"><i class="fas fa-user"></i> 用戶名</span>
                    <div class="info-action-group">
                        <!-- 查看模式 -->
                        <div class="view-mode" id="view-username">
                            <span class="info-value" th:text="${user.username}">username</span>
                            <button class="btn-icon btn-edit" th:attr="data-val=${user.username}"
                                onclick="toggleEdit('username', this.dataset.val)" data-tooltip="編輯">
                                <i class="fas fa-pen"></i>
                            </button>
                        </div>
                        <!-- 編輯模式 -->
                        <div class="edit-mode" id="edit-username">
                            <input type="text" id="input-username" class="form-input" th:value="${user.username}">
                            <button class="btn-action btn-save" onclick="saveField('username')">保存</button>
                            <button class="btn-action btn-cancel" onclick="cancelEdit('username')">取消</button>
                        </div>
                    </div>
                </div>

                <!-- 電子郵件 (僅展示，不可改) -->
                <div class="info-row">
                    <span class="info-label"><i class="fas fa-envelope"></i> 電子郵件</span>
                    <span class="info-value" th:text="${user.email}">user@example.com</span>
                </div>

                <!-- 手機號碼 (僅展示，不可改) -->
                <div class="info-row">
                    <span class="info-label"><i class="fas fa-phone"></i> 手機號碼</span>
                    <span class="info-value" th:text="${user.phone}">+852 1234 5678</span>
                </div>

                <!-- 地址 (為空顯示增加，不為空顯示編輯) -->
                <div class="info-row">
                    <span class="info-label"><i class="fas fa-map-marker-alt"></i> 地址</span>
                    <div class="info-action-group">
                        <div class="view-mode" id="view-address">
                            <span class="info-value" th:text="${user.address != null ? user.address : '未設置'}">未設置</span>
                            <!-- 如果有值，顯示編輯按鈕 -->
                            <button class="btn-icon btn-edit" th:if="${user.address != null}"

                            </button>
                            <!-- 如果為空，顯示增加按鈕 -->
                            <button class="btn-icon btn-add" th:if="${user.address == null}"
                                onclick="toggleEdit('address', '')" data-tooltip="增加地址">

                                <!-- 第二级：行政区 (初始禁用) -->

                                <!-- 详细地址输入框 -->
                                <div class="address-input-wrapper">

                <!-- 備用地址 (為空顯示增加，不為空顯示編輯) -->
                <div class="info-row">
                    <span class="info-label"><i class="fas fa-location-dot"></i> 備用地址</span>
                    <div class="info-action-group">
                        <div class="view-mode" id="view-backupAddress">

                                onclick="deleteBackupAddress()" data-tooltip="刪除備用地址"
                                style="background: #dc3545; color: white; border: none;">
                                <i class="fas fa-trash-alt"></i>
                            </button>

                            <!-- 5. 增加按鈕 -->
                            <button class="btn-icon btn-add" th:if="${#strings.isEmpty(user.backupAddress)}"
                                onclick="toggleEdit('backupAddress', '')" data-tooltip="增加備用地址">
                                <i class="fas fa-plus"></i> 增加備用地址
                            </button>
                        </div>
                        <div class="edit-mode" id="edit-backupAddress">
                            <div class="address-selector-group">
                                <!-- 第一级：大区域 -->
                                <select id="backupRegionSelect" class="address-select">
                                    <option value="">请选择区域</option>
                                    <option value="港岛">港岛</option>
                                    <option value="九龙">九龙</option>
                                    <option value="新界">新界</option>
                                </select>

                                <!-- 第二级：行政区 (初始禁用) -->
                                <select id="backupDistrictSelect" disabled class="address-select">

                                <!-- 详细地址输入框 -->

                                    <button class="btn-action btn-save" onclick="saveField('backupAddress')">保存</button>

                <!-- 互换地址确认弹窗 (自定义 Modal) -->
                <div id="swapAddressModal" class="custom-modal-overlay" style="display: none;">
                    <div class="custom-modal-box swap-modal">

                        </div>
                        <h3 class="modal-title" style="color: var(--primary); margin-bottom: 1rem;">确认交换地址？</h3>

                        <p style="color: var(--gray); margin-bottom: 1.5rem; font-size: 0.95rem;">
                            确定要交换主地址和备用地址吗？

                        <!-- 地址预览区域 -->

                            <button class="btn-modal-primary" onclick="confirmSwapAddress()">
                                <i class="fas fa-check"></i> 确定交换
                            </button>
                        </div>
                    </div>
                </div>

                <!--  删除备用地址确认弹窗 (自定义 Modal) -->
                <div id="deleteBackupAddressModal" class="custom-modal-overlay" style="display: none;">
                    <div class="custom-modal-box delete-modal">
                        <div class="modal-icon" style="color: #dc3545; margin-bottom: 1rem;">
                            <i class="fas fa-trash-alt" style="font-size: 2.5rem;"></i>
                        </div>
                        <h3 class="modal-title" style="color: var(--primary); margin-bottom: 1rem;">确认删除备用地址？</h3>

                        <p style="color: var(--gray); margin-bottom: 1.5rem; font-size: 0.95rem;">
                            此操作将清空备用地址字段，且无法撤销。
                        </p>

                        <!-- 按钮区域 -->
                        <div class="modal-actions"
                            style="display: flex; gap: 1rem; justify-content: center; margin-top: 2rem;">

                            <button class="btn-modal-primary" id="confirmDeleteBackupBtn"
                                onclick="confirmDeleteBackupAction()" style="background: #dc3545; color: white;">

    <!--  新增：頁腳 (Footer) -->
    <footer class="footer">
        <p>&copy; <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2026</span> ChronoTeam. All
            Rights Reserved.</p>
    </footer>

    <!--  引入公共弹窗 HTML -->
    <div th:replace="~{fragments/common :: modals}"></div>

    <!--  注入登录状态变量與內聯編輯 JS 邏輯 -->
    <script th:inline="javascript">
        // 獲取 Spring Security 狀態
        const isLoggedIn = [[${#authorization.expression('isAuthenticated()')} ?: false]];

        // ==========================================
        //  地址級聯選擇器數據
        // ==========================================
        const districtData = {
            '港岛': ['中西区', '湾仔区', '东区', '南区'],
            '九龙': ['油尖旺区', '深水埗区', '九龙城区', '黄大仙区', '观塘区'],
            '新界': ['荃湾区', '屯门区', '元朗区', '北区', '大埔区', '西贡区', '沙田区', '葵青区', '离岛区']
        };

        // ==========================================
        //  地址級聯選擇器邏輯 (主地址)
        // ==========================================
        const addressRegionSelect = document.getElementById('addressRegionSelect');
        const addressDistrictSelect = document.getElementById('addressDistrictSelect');
        const addressInput = document.getElementById('input-address');

        if (addressRegionSelect && addressDistrictSelect && addressInput) {
            // 监听第一级下拉框变化
            addressRegionSelect.addEventListener('change', function () {
                const selectedRegion = this.value;

                // 清空并重置第二级下拉框
                addressDistrictSelect.innerHTML = '<option value="">请选择行政区</option>';
                addressDistrictSelect.disabled = true;
                addressDistrictSelect.style.backgroundColor = '#f8f9fa';

                // 清空输入框，并写入区域名称
                if (selectedRegion) {
                    addressInput.value = selectedRegion + ' ';
                } else {
                    addressInput.value = '';
                }

                if (selectedRegion && districtData[selectedRegion]) {
                    addressDistrictSelect.disabled = false;
                    addressDistrictSelect.style.backgroundColor = 'white';

                    // 填充第二级选项
                    districtData[selectedRegion].forEach(district => {
                        const option = document.createElement('option');
                        option.value = district;
                        option.textContent = district;
                        addressDistrictSelect.appendChild(option);
                    });
                }
            });

            // 监听第二级下拉框变化 -> 追加到地址栏
            addressDistrictSelect.addEventListener('change', function () {
                const region = addressRegionSelect.value;
                const district = this.value;

                if (region && district) {
                    // 直接追加行政区到输入框
                    addressInput.value = region + ' ' + district + ' ';
                    addressInput.focus();
                }
            });
        }

        // ==========================================
        //  地址級聯選擇器邏輯 (備用地址)
        // ==========================================
        const backupRegionSelect = document.getElementById('backupRegionSelect');
        const backupDistrictSelect = document.getElementById('backupDistrictSelect');
        const backupAddressInput = document.getElementById('input-backupAddress');

        if (backupRegionSelect && backupDistrictSelect && backupAddressInput) {
            // 监听第一级下拉框变化
            backupRegionSelect.addEventListener('change', function () {
                const selectedRegion = this.value;

                // 清空并重置第二级下拉框
                backupDistrictSelect.innerHTML = '<option value="">请选择行政区</option>';
                backupDistrictSelect.disabled = true;
                backupDistrictSelect.style.backgroundColor = '#f8f9fa';

                // 清空输入框，并写入区域名称
                if (selectedRegion) {
                    backupAddressInput.value = selectedRegion + ' ';
                } else {
                    backupAddressInput.value = '';
                }

                if (selectedRegion && districtData[selectedRegion]) {
                    backupDistrictSelect.disabled = false;
                    backupDistrictSelect.style.backgroundColor = 'white';

                    // 填充第二级选项
                    districtData[selectedRegion].forEach(district => {
                        const option = document.createElement('option');
                        option.value = district;
                        option.textContent = district;
                        backupDistrictSelect.appendChild(option);
                    });
                }
            });

            // 监听第二级下拉框变化 -> 追加到地址栏
            backupDistrictSelect.addEventListener('change', function () {
                const region = backupRegionSelect.value;
                const district = this.value;

                if (region && district) {
                    // 直接追加行政区到输入框
                    backupAddressInput.value = region + ' ' + district + ' ';
                    backupAddressInput.focus();
                }
            });
        }

        /**
         * 切換到編輯模式
         */
        function toggleEdit(fieldName, originalValue) {
            document.getElementById('view-' + fieldName).style.display = 'none';
            document.getElementById('edit-' + fieldName).style.display = 'flex';

            const input = document.getElementById('input-' + fieldName);
            input.value = originalValue || '';
            input.focus();

            input.onkeydown = function (e) {
                if (e.key === 'Enter') saveField(fieldName);
                if (e.key === 'Escape') cancelEdit(fieldName);
            };
        }

        /**
         * 取消編輯，恢復查看模式
         */
        function cancelEdit(fieldName) {
            document.getElementById('edit-' + fieldName).style.display = 'none';
            document.getElementById('view-' + fieldName).style.display = 'flex';
            resetAddressSelector(fieldName);
        }

        /**
         * 重置地址选择器
         */
        function resetAddressSelector(fieldName) {
            const regionSelect = document.getElementById(fieldName + 'RegionSelect');
            const districtSelect = document.getElementById(fieldName + 'DistrictSelect');
            const input = document.getElementById('input-' + fieldName);

            if (regionSelect && districtSelect && input) {
                regionSelect.value = '';
                districtSelect.innerHTML = '<option value="">请先选择区域</option>';
                districtSelect.disabled = true;
                districtSelect.style.backgroundColor = '#f8f9fa';
                input.value = '';
            }
        }

        /**
         * 顯示居中彈窗 (幾秒後自動消失)
         * @param {string} message - 提示文字
         * @param {string} type - 類型: 'info'(金色), 'error'(紅色), 'success'(綠色)
         */
        function showCenterToast(message, type = 'info') {
            // 移除可能已存在的彈窗
            const existing = document.querySelector('.center-toast-overlay');
            if (existing) existing.remove();

            let iconClass = 'fas fa-info-circle';
            let boxClass = '';

            if (type === 'error') {
                iconClass = 'fas fa-exclamation-circle';
                boxClass = 'toast-error';
            } else if (type === 'success') {
                iconClass = 'fas fa-check-circle';
                boxClass = 'toast-success';
            }

            // 創建彈窗 DOM
            const overlay = document.createElement('div');
            overlay.className = 'center-toast-overlay';
            overlay.innerHTML = `
        <div class="center-toast-box ${boxClass}">
            <div class="center-toast-icon"><i class="${iconClass}"></i></div>
            <div class="center-toast-message">${message}</div>
        </div>
    `;

            document.body.appendChild(overlay);

            overlay.addEventListener('click', function (e) {
                // 只有點擊 overlay 本身（不是內部的 toast-box）才關閉
                if (e.target === overlay) {
                    closeToast(overlay);
                }
            });

            // 3秒後自動淡出並移除
            setTimeout(() => {
                overlay.style.transition = 'opacity 0.3s ease';
                overlay.style.opacity = '0';
                setTimeout(() => overlay.remove(), 300);
            }, 3000);
        }

        // 統一的關閉彈窗函數
        function closeToast(overlay) {
            if (overlay && !overlay.classList.contains('closing')) {
                overlay.classList.add('closing');
                overlay.style.transition = 'opacity 0.3s ease';
                overlay.style.opacity = '0';
                setTimeout(() => overlay.remove(), 300);
            }
        }

        /**
         * 保存字段並發送 AJAX 請求
         */
        function saveField(fieldName) {
            const input = document.getElementById('input-' + fieldName);
            const newValue = input.value.trim();

            if (fieldName === 'username' && !newValue) {
                showCenterToast('❌ 用戶名不能為空！', 'error');
                return;
            }

            // 地址校驗邏輯保持不變...
            if (fieldName === 'address' || fieldName === 'backupAddress') {
                const regionSelect = document.getElementById(fieldName + 'RegionSelect');
                const region = regionSelect ? regionSelect.value : '';
                const currentAddress = document.querySelector('#view-address .info-value')?.textContent?.trim() || '';
                const currentBackupAddress = document.querySelector('#view-backupAddress .info-value')?.textContent?.trim() || '';

                if (region && (!newValue || !newValue.includes(region))) {
                    showCenterToast('❌ 詳細地址必須包含所選區域！', 'error');
                    input.focus();
                    return;
                }
                // 验证1：新地址与现有地址相同
                if (fieldName === 'address' && newValue === currentAddress) {
                    showCenterToast('💡 新地址和原地址一樣，無需修改', 'info');
                    cancelEdit(fieldName);
                    return;
                }

                // 验证2：新备用地址与现有备用地址相同
                if (fieldName === 'backupAddress' && newValue === currentBackupAddress) {
                    showCenterToast('💡 新備用地址和原備用地址一樣，無需修改', 'info');
                    cancelEdit(fieldName);
                    return;
                }

                // 验证3：主地址和备用地址不能相同
                if (fieldName === 'address' && newValue === currentBackupAddress && currentBackupAddress !== '未設置') {
                    showCenterToast('❌ 主地址和備用地址不能相同！', 'error');
                    return;
                }

                if (fieldName === 'backupAddress' && newValue === currentAddress && currentAddress !== '未設置') {
                    showCenterToast('❌ 備用地址和主地址不能相同！', 'error');
                    return;
                }
            }

            const data = {};
            data[fieldName] = newValue;

            // 顯示 Loading 狀態 (可選)
            const btn = input.parentElement.querySelector('.btn-save');

            fetch('/api/user/update-profile', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
                .then(response => response.json())
                .then(result => {
                    if (result.success) {
                        // 1. 更新頁面上的顯示文本
                        const valueSpan = document.querySelector('#view-' + fieldName + ' .info-value');
                        valueSpan.textContent = newValue || '未設置';

                        // 2. 動態切換按鈕顯示狀態
                        const editBtn = document.querySelector('#view-' + fieldName + ' .btn-edit');
                        const addBtn = document.querySelector('#view-' + fieldName + ' .btn-add');

                        if (newValue) {
                            if (editBtn) {editBtn.style.display = 'inline-flex'; editBtn.dataset.val = newValue;}
                            if (addBtn) addBtn.style.display = 'none';
                        } else {
                            if (editBtn) editBtn.style.display = 'none';
                            if (addBtn) addBtn.style.display = 'inline-flex';
                        }

                        cancelEdit(fieldName);

                        //  根據字段顯示不同的成功提示
                        if (fieldName === 'username') {
                            // 1. 顯示提示文案，告知需要重新登入
                            showCenterToast('✅ 改名已成功！請使用新用戶名重新登入', 'success');

                            // 2. 延遲 3 秒後強制登出並跳轉回首頁 (與彈窗消失時間同步)
                            setTimeout(() => {
                                fetch('/logout', {method: 'POST'})
                                    .then(() => {
                                        window.location.href = '/'; // 登出成功，跳轉首頁
                                    })
                                    .catch(() => {
                                        window.location.href = '/'; // 即使接口報錯也強制跳轉
                                    });
                            }, 3000);
                        } else if (fieldName === 'backupAddress') {
                            //  备用地址保存成功后，延迟刷新页面
                            showCenterToast('✅ 備用地址保存成功！', 'success');
                            setTimeout(() => {
                                location.reload();
                            }, 1000);
                        } else {
                            showCenterToast('✅ 保存成功！', 'success');
                        }
                    } else {
                        //  核心修复：失败时关闭编辑模式，恢复查看模式
                        cancelEdit(fieldName);

                        //  根據後端返回的特定 message 顯示不同的居中彈窗
                        if (result.message === 'SAME_USERNAME') {
                            showCenterToast('💡 新用戶名和原來一樣，無需修改', 'info');
                        } else if (result.message === 'USERNAME_EXISTS') {
                            showCenterToast('❌ 該用戶名已被註冊，請選擇別的用戶名吧', 'error');
                        } else {
                            showCenterToast('❌ ' + (result.message || '保存失敗'), 'error');
                        }
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    //  网络错误也要关闭编辑模式
                    cancelEdit(fieldName);
                    showCenterToast('❌ 網絡錯誤，請稍後再試！', 'error');
                });
        }

        // ==========================================
        //   交換主地址和備用地址
        // ==========================================
        async function swapAddresses() {
            const address = document.querySelector('#view-address .info-value').textContent;
            const backupAddress = document.querySelector('#view-backupAddress .info-value').textContent;

            if (address === '未設置' || backupAddress === '未設置') {
                showNotification('❌ 主地址和備用地址都必須有值才能交換！', true);
                return;
            }

            if (!confirm('確定要交換主地址和備用地址嗎？\n\n主地址將變為：' + backupAddress + '\n備用地址將變為：' + address)) {
                return;
            }

            try {
                const response = await fetch('/api/user/update-profile', {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        address: backupAddress,
                        backupAddress: address
                    })
                });

                const result = await response.json();

                if (result.success) {
                    // 更新頁面上的顯示
                    document.querySelector('#view-address .info-value').textContent = backupAddress;
                    document.querySelector('#view-backupAddress .info-value').textContent = address;

                    // 更新編輯按鈕的 data-val
                    const addressEditBtn = document.querySelector('#view-address .btn-edit');
                    const backupEditBtn = document.querySelector('#view-backupAddress .btn-edit');

                    if (addressEditBtn) addressEditBtn.dataset.val = backupAddress;
                    if (backupEditBtn) backupEditBtn.dataset.val = address;

                    showNotification('✅ 地址交換成功！');
                } else {
                    showNotification('❌ ' + (result.message || '交換失敗'), true);
                }
            } catch (error) {
                console.error('交換地址錯誤:', error);
                showNotification('❌ 網絡錯誤，請稍後重試', true);
            }
        }

        // 1. 打开删除确认弹窗
        function openDeleteBackupModal() {
            document.getElementById('deleteBackupAddressModal').style.display = 'flex';
            document.body.style.overflow = 'hidden'; // 禁止背景滚动
        }

        // 2. 关闭删除确认弹窗
        function closeDeleteBackupModal() {
            document.getElementById('deleteBackupAddressModal').style.display = 'none';
            document.body.style.overflow = ''; // 恢复背景滚动
        }

        // 3. 核心：删除备用地址函数 (修改版)
        async function deleteBackupAddress() {
            //  打开自定义弹窗，而不是使用 confirm()
            openDeleteBackupModal();
        }

        // 4. 确认删除操作 (点击弹窗中的“确定删除”按钮时调用)
        async function confirmDeleteBackupAction() {
            // 先关闭弹窗
            closeDeleteBackupModal();

            // 获取按钮并设置 Loading 状态
            const btn = document.getElementById('confirmDeleteBackupBtn');
            const originalHtml = btn.innerHTML;
            try {
                const response = await fetch('/api/user/update-profile', {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({backupAddress: ''}) // 清空备用地址
                });

                const result = await response.json();

                if (result.success) {
                    // 更新页面上的显示
                    document.querySelector('#view-backupAddress .info-value').textContent = '未設置';

                    // 隐藏编辑按钮、交换按钮和删除按钮，显示增加按钮
                    const viewMode = document.getElementById('view-backupAddress');
                    const editBtn = viewMode.querySelector('.btn-edit');
                    const swapBtn = viewMode.querySelector('.btn-swap');
                    const deleteBtn = viewMode.querySelector('.btn-delete-backup');
                    const addBtn = viewMode.querySelector('.btn-add');

                    if (editBtn) editBtn.style.display = 'none';
                    if (swapBtn) swapBtn.style.display = 'none';
                    if (deleteBtn) deleteBtn.style.display = 'none';
                    if (addBtn) addBtn.style.display = 'inline-flex';

                    // 显示成功提示 (使用你之前的 showNotification 或 showCenterToast)
                    if (typeof showNotification === 'function') {
                        showNotification('✅ 備用地址已刪除！');
                    } else {
                        alert('✅ 備用地址已刪除！');
                    }
                    // 【新增】延迟 1 秒后刷新页面
                    setTimeout(() => {
                        window.location.reload();
                    }, 1000);

                } else {
                    if (typeof showNotification === 'function') {
                        showNotification('❌ ' + (result.message || '刪除失敗'), true);
                    } else {
                        alert('❌ ' + (result.message || '刪除失敗'));
                    }
                }
            } catch (error) {
                console.error('刪除備用地址錯誤:', error);
                if (typeof showNotification === 'function') {
                    showNotification('❌ 網絡錯誤，請稍後重試', true);
                } else {
                    alert(' 網絡錯誤，請稍後重試');
                }
            } finally {
                // 恢复按钮状态
                btn.innerHTML = originalHtml;
            }
        }

        // 5. 点击遮罩层关闭弹窗
        document.getElementById('deleteBackupAddressModal')?.addEventListener('click', function (e) {
            if (e.target === this) {
                closeDeleteBackupModal();
            }
        });

        // 6. ESC 键关闭弹窗
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                const modal = document.getElementById('deleteBackupAddressModal');
                if (modal && modal.style.display === 'flex') {
                    closeDeleteBackupModal();
                }
            }
        });

        // ==========================================
        //   交換主地址和備用地址 (自定義彈窗版)
        // ==========================================

        // 1. 打开互换弹窗
        function openSwapModal() {
            // 统一从 .info-value 获取当前地址文本
            const currentMainAddress = document.querySelector('#view-address .info-value')?.innerText.trim() || '';
            const currentBackupAddress = document.querySelector('#view-backupAddress .info-value')?.innerText.trim() || '';

            // 校验：如果有一个地址为空或为"未設置"，提示用户
            if (!currentMainAddress || !currentBackupAddress || currentMainAddress === '未設置' || currentBackupAddress === '未設置') {
                if (typeof showCenterToast === 'function') {
                    showCenterToast('❌ 主地址和備用地址都必須有值才能交換！', 'error');
                } else if (typeof showNotification === 'function') {
                    showNotification('❌ 主地址和備用地址都必須有值才能交換！', true);
                }
                return;
            }

            // 填入弹窗预览（注意：交换后，主地址变成原来的备用，备用变成原来的主）
            document.getElementById('swapMainAddressPreview').innerText = currentBackupAddress;
            document.getElementById('swapBackupAddressPreview').innerText = currentMainAddress;

            // 显示弹窗
            document.getElementById('swapAddressModal').style.display = 'flex';
        }

        // 2. 关闭弹窗
        function closeSwapModal() {
            document.getElementById('swapAddressModal').style.display = 'none';
        }

        // 3. 确认交换逻辑
        async function confirmSwapAddress() {
            const btn = document.querySelector('.btn-modal-primary');
            const originalHtml = btn.innerHTML;


            // 直接从预览框获取交换后的新值
            const newMainAddress = document.getElementById('swapMainAddressPreview').innerText.trim();
            const newBackupAddress = document.getElementById('swapBackupAddressPreview').innerText.trim();

            try {
                // 调用后端更新接口
                const response = await fetch('/api/user/update-profile', {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        address: newMainAddress,
                        backupAddress: newBackupAddress
                    })
                });

                const result = await response.json();

                if (result.success) {
                    // 1. 更新页面上的显示文本 (无需刷新页面)
                    document.querySelector('#view-address .info-value').textContent = newMainAddress;
                    document.querySelector('#view-backupAddress .info-value').textContent = newBackupAddress;

                    // 2. 更新编辑按钮的 data-val 属性
                    const addressEditBtn = document.querySelector('#view-address .btn-edit');
                    const backupEditBtn = document.querySelector('#view-backupAddress .btn-edit');
                    if (addressEditBtn) addressEditBtn.dataset.val = newMainAddress;
                    if (backupEditBtn) backupEditBtn.dataset.val = newBackupAddress;

                    // 3. 显示成功提示
                    if (typeof showCenterToast === 'function') {
                        showCenterToast('✅ 地址交換成功！', 'success');
                    } else if (typeof showNotification === 'function') {
                        showNotification('✅ 地址交換成功！');
                    }

                    // 4. 关闭弹窗
                    closeSwapModal();
                } else {
                    // 处理后端返回的错误
                    if (typeof showCenterToast === 'function') {
                        showCenterToast('❌ ' + (result.message || '交換失敗'), 'error');
                    } else if (typeof showNotification === 'function') {
                        showNotification('❌ ' + (result.message || '交換失敗'), true);
                    }
                    // 恢复按钮
                    btn.innerHTML = originalHtml;
                }
            } catch (error) {
                console.error('交換失敗:', error);
                if (typeof showCenterToast === 'function') {
                    showCenterToast('❌ 網絡錯誤，請稍後重試', 'error');
                } else if (typeof showNotification === 'function') {
                    showNotification('❌ 網絡錯誤，請稍後重試', true);
                }
                btn.innerHTML = originalHtml;
            }
        }

        // 点击遮罩层也可以关闭弹窗
        document.getElementById('swapAddressModal')?.addEventListener('click', function (e) {
            if (e.target === this) {
                closeSwapModal();
            }
        });
    </script>

    <script src="/js/common.js"></script>
