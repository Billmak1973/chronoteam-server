<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帳戶信息 - ChronoTeam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!--  1. 引入公共 CSS -->
    <link rel="stylesheet" href="/css/common.css">
    <!--  2. 引入側邊欄專屬 CSS -->
    <link rel="stylesheet" href="/css/sidebar.css">

    <!--  3. 頁面特有 CSS -->
    <style>
        :root {
            --primary-color: #1a1a2e;
            --secondary-color: #16213e;
            --accent-color: #e94560;
            --gold-color: #d4af37;
            --gold-light: #f4e4ba;
            --gold-dark: #b8941f;
            --success-color: #10b981;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --bg-primary: #ffffff;
            --bg-secondary: #f9fafb;
            --border-color: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --radius-sm: 0.5rem;
            --radius-md: 0.75rem;
            --radius-lg: 1rem;
            --radius-xl: 1.5rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* 主容器布局 */
        .dashboard-container {
            display: flex;
            min-height: calc(100vh - 80px);
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            gap: 2rem;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 主内容区域 */
        .main-content {
            flex: 1;
            background: var(--bg-primary);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            padding: 2.5rem;
            position: relative;
            overflow: hidden;
        }

        .main-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--gold-color) 0%, var(--accent-color) 100%);
        }

        /* 页面标题 */
        h2 {
            color: var(--primary-color);
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
            position: relative;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 60px;
            height: 2px;
            background: var(--gold-color);
        }

        h2 i {
            color: var(--gold-color);
            font-size: 2.2rem;
            background: linear-gradient(135deg, var(--gold-color) 0%, var(--gold-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 信息卡片容器 */
        .info-card {
            margin-top: 2rem;
        }

        /* 信息行 */
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            margin-bottom: 1rem;
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            border: 2px solid transparent;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .info-row::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--gold-color);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .info-row:hover {
            border-color: var(--gold-light);
            transform: translateX(5px);
            box-shadow: var(--shadow-md);
            background: linear-gradient(135deg, #ffffff 0%, var(--bg-secondary) 100%);
        }

        .info-row:hover::before {
            transform: scaleY(1);
        }

        /* 信息标签 */
        .info-label {
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.95rem;
        }

        .info-label i {
            color: var(--gold-color);
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        /* 信息值 */
        .info-value {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 1.05rem;
        }

        /* 操作组 */
        .info-action-group {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
            justify-content: flex-end;
        }

        /* 查看模式和编辑模式 */
        .view-mode,
        .edit-mode {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .edit-mode {
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* 表单输入框 */
        .form-input {
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 1rem;
            color: var(--text-primary);
            background: white;
            transition: all 0.3s ease;
            width: 280px;
            max-width: 100%;
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--gold-color);
            background: white;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
            transform: translateY(-1px);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.7;
        }

        /* 按钮图标 */
        .btn-icon {
            background: white;
            border: 2px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.6rem 0.8rem;
            border-radius: var(--radius-md);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }

        .btn-icon::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--gold-color) 0%, var(--gold-light) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 0;
        }

        .btn-icon>* {
            position: relative;
            z-index: 1;
        }

        .btn-icon:hover {
            color: var(--gold-dark);
            border-color: var(--gold-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.25);
        }

        .btn-icon:hover::before {
            opacity: 0.1;
        }

        .btn-icon i {
            font-size: 0.95rem;
        }

        .btn-add {
            color: var(--text-primary);
            border-style: dashed;
        }

        .btn-add:hover {
            border-color: var(--gold-color);
            color: var(--gold-color);
            background: rgba(212, 175, 55, 0.05);
        }

        /* 操作按钮 */
        .btn-action {
            padding: 0.6rem 1.5rem;
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        .btn-action::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-action:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-save {
            background: linear-gradient(135deg, var(--gold-color) 0%, var(--gold-dark) 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        .btn-save:active {
            transform: translateY(0);
        }

        .btn-cancel {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 2px solid var(--border-color);
        }

        .btn-cancel:hover {
            background: white;
            border-color: var(--text-secondary);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        /* 返回按钮 */
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            margin-top: 2.5rem;
            padding: 0.875rem 2rem;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            text-decoration: none;
            border-radius: var(--radius-lg);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            font-size: 1rem;
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
        }

        .btn-back::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn-back:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
            background: linear-gradient(135deg, var(--gold-color) 0%, var(--gold-dark) 100%);
        }

        .btn-back:hover::before {
            left: 100%;
        }

        /* 自定义弹窗 */
        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .custom-modal-box {
            background: white;
            padding: 2.5rem;
            border-radius: var(--radius-xl);
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: var(--shadow-xl);
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .custom-modal-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--gold-color) 0%, var(--accent-color) 100%);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-color) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .modal-icon i {
            font-size: 2.5rem;
            color: white;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .btn-modal-primary {
            background: linear-gradient(135deg, var(--gold-color) 0%, var(--gold-dark) 100%);
            color: white;
            border: none;
            padding: 0.875rem 2rem;
            border-radius: var(--radius-lg);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .btn-modal-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        .btn-modal-secondary {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 2px solid var(--border-color);
            padding: 0.875rem 2rem;
            border-radius: var(--radius-lg);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-modal-secondary:hover {
            background: white;
            border-color: var(--text-secondary);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        /* 居中提示弹窗 */
        .center-toast-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .center-toast-box {
            background: white;
            padding: 2.5rem 3rem;
            border-radius: var(--radius-xl);
            text-align: center;
            box-shadow: var(--shadow-xl);
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            min-width: 350px;
            max-width: 450px;
            border-top: 5px solid var(--gold-color);
        }

        .center-toast-box.toast-error {
            border-top-color: var(--error-color);
        }

        .center-toast-box.toast-error .center-toast-icon {
            color: var(--error-color);
            background: linear-gradient(135deg, #fecaca 0%, var(--error-color) 100%);
        }

        .center-toast-box.toast-success {
            border-top-color: var(--success-color);
        }

        .center-toast-box.toast-success .center-toast-icon {
            color: var(--success-color);
            background: linear-gradient(135deg, #d1fae5 0%, var(--success-color) 100%);
        }

        .center-toast-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-color) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
            animation: bounce 0.6s ease;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .center-toast-icon i {
            font-size: 3rem;
            color: white;
        }

        .center-toast-message {
            font-size: 1.2rem;
            color: var(--text-primary);
            font-weight: 600;
            line-height: 1.6;
        }

        /* 页脚 */
        .footer {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: rgba(255, 255, 255, 0.8);
            padding: 2rem;
            text-align: center;
            margin-top: 3rem;
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .dashboard-container {
                flex-direction: column;
            }

            .main-content {
                padding: 2rem;
            }
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 1.5rem;
            }

            .info-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .info-action-group {
                flex-direction: column;
                align-items: stretch;
                width: 100%;
            }

            .form-input {
                width: 100%;
            }

            h2 {
                font-size: 1.5rem;
            }

            .center-toast-box {
                min-width: auto;
                padding: 2rem;
            }
        }

        /* 加载动画 */
        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }

            100% {
                background-position: 1000px 0;
            }
        }

        .loading {
            animation: shimmer 2s infinite linear;
            background: linear-gradient(to right, var(--bg-secondary) 4%, var(--border-color) 25%, var(--bg-secondary) 36%);
            background-size: 1000px 100%;
        }

        /* 禁用状态 */
        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-action:disabled::before {
            display: none;
        }

        /* === 地址彈窗專屬樣式 === */
        .address-modal-box {
            max-width: 500px;
            text-align: left;
            padding: 2rem;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.3s;
            line-height: 1;
        }

        .modal-close-btn:hover {
            color: var(--accent-color);
        }

        .form-group-modal {
            margin-bottom: 1.25rem;
        }

        .form-group-modal label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .required {
            color: var(--accent-color);
        }

        .form-input-modal {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            color: var(--text-primary);
            background: white;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-input-modal.textarea-input {
            resize: vertical;
            min-height: 80px;
        }

        .form-input-modal:focus {
            outline: none;
            border-color: var(--gold-color);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
        }

        /* 自定義 Checkbox 樣式 */
        .checkbox-group {
            margin-top: 1.5rem;
        }

        .custom-checkbox {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text-primary);
            user-select: none;
        }

        .custom-checkbox input {
            display: none;
        }

        .checkmark {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            margin-right: 0.75rem;
            position: relative;
            transition: all 0.3s;
        }

        .custom-checkbox input:checked+.checkmark {
            background-color: var(--gold-color);
            border-color: var(--gold-color);
        }

        .custom-checkbox input:checked+.checkmark::after {
            content: '';
            position: absolute;
            left: 6px;
            top: 2px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* 按鈕加載狀態 */
        .btn-modal-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ========================================== */
        /*   刪除確認彈窗專屬樣式 (危險操作主題)      */
        /* ========================================== */
        .delete-modal-box .modal-icon.warning-icon {
            background: linear-gradient(135deg, #ff6b6b 0%, #dc3545 100%);
            box-shadow: 0 8px 25px rgba(220, 53, 69, 0.35), 0 0 0 8px rgba(220, 53, 69, 0.08);
            animation: iconPulse 2s ease-in-out infinite;
        }

        .delete-modal-box .modal-icon.warning-icon i {
            color: #fff;
        }

        @keyframes iconPulse {

            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 8px 25px rgba(220, 53, 69, 0.35), 0 0 0 8px rgba(220, 53, 69, 0.08);
            }

            50% {
                transform: scale(1.05);
                box-shadow: 0 8px 30px rgba(220, 53, 69, 0.5), 0 0 0 12px rgba(220, 53, 69, 0.04);
            }
        }

        .btn-modal-danger {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            border: none;
            padding: 0.875rem 2rem;
            border-radius: var(--radius-lg);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.35);
        }

        .btn-modal-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(220, 53, 69, 0.5);
            filter: brightness(1.1);
        }

        .btn-modal-danger:active {
            transform: scale(0.96);
        }

        .btn-modal-danger:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* === 編輯地址彈窗專屬樣式 === */
        .edit-address-modal-box {
            max-width: 550px;
            text-align: left;
        }

        .edit-address-modal-box .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .edit-address-modal-box .modal-close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.3s;
        }

        .edit-address-modal-box .modal-close-btn:hover {
            color: var(--accent-color);
        }

        .form-group-modal {
            margin-bottom: 1.25rem;
        }

        .form-group-modal label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .form-input-modal {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            color: var(--text-primary);
            background: white;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-input-modal.textarea-input {
            resize: vertical;
            min-height: 80px;
        }

        .form-input-modal:focus {
            outline: none;
            border-color: var(--gold-color);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
        }

        .required {
            color: var(--accent-color);
        }

        /* 隱藏數字輸入框的上下箭頭 */
        #editRanking {
            -moz-appearance: textfield;
            /* Firefox */
        }

        #editRanking::-webkit-outer-spin-button,
        #editRanking::-webkit-inner-spin-button {
            -webkit-appearance: none;
            /* Chrome, Safari, Edge */
            margin: 0;
        }
    </style>
</head>

<body>

    <!--  引入公共导航栏 -->
    <div th:replace="~{fragments/common :: navbar}"></div>

    <!--  4. 使用 Flex 佈局容器 -->
    <div class="dashboard-container">

        <!--  5. 引入側邊欄 Fragment，並傳入 activePage='profile' 以高亮「帳戶信息」菜單 -->
        <div th:replace="~{fragments/sidebar :: sidebar(activePage='profile')}"></div>

        <!--  6. 右側主內容 (已替換為支援內聯編輯的版本) -->
        <main class="main-content">
            <h2><i class="fas fa-id-card" style="color: var(--gold);"></i> 帳戶信息</h2>
            <div class="info-card">

                <!-- 用戶名 (始終可編輯) -->
                <div class="info-row">
                    <span class="info-label"><i class="fas fa-user"></i> 用戶名</span>
                    <div class="info-action-group">
                        <!-- 查看模式 -->
                        <div class="view-mode" id="view-username">
                            <span class="info-value" th:text="${user.username}">username</span>

                            <!-- 只有當用戶名不是 admin 時，才顯示編輯按鈕 -->
                            <button class="btn-icon btn-edit"
                                th:if="${!#strings.equalsIgnoreCase(user.username, 'admin')}"
                                th:attr="data-val=${user.username}" onclick="toggleEdit('username', this.dataset.val)"
                                data-tooltip="編輯">
                                <i class="fas fa-pen"></i>
                            </button>
                        </div>

                        <!-- 編輯模式 (保持原樣即可，因為按鈕被隱藏後無法觸發切換) -->
                        <div class="edit-mode" id="edit-username">
                            <input type="text" id="input-username" class="form-input" th:value="${user.username}">
                            <button class="btn-action btn-save" onclick="saveField('username')">保存</button>
                            <button class="btn-action btn-cancel" onclick="cancelEdit('username')">取消</button>
                        </div>
                    </div>
                </div>

                <!-- 電子郵件 (僅展示，不可改) -->
                <div class="info-row">
                    <span class="info-label"><i class="fas fa-envelope"></i> 電子郵件</span>
                    <div class="info-action-group">
                        <div class="view-mode" id="view-email">
                            <span class="info-value" th:text="${user.email}">user@example.com</span>
                            <!-- 僅非 CUSTOMER 角色顯示編輯按鈕 -->
                            <button class="btn-icon btn-edit" th:if="${user.role.name() != 'CUSTOMER'}"
                                th:attr="data-val=${user.email}" onclick="toggleEdit('email', this.dataset.val)"
                                data-tooltip="編輯">
                                <i class="fas fa-pen"></i>
                            </button>
                        </div>
                        <div class="edit-mode" id="edit-email">
                            <input type="email" id="input-email" class="form-input" th:value="${user.email}">
                            <button class="btn-action btn-save" onclick="saveField('email')">保存</button>
                            <button class="btn-action btn-cancel" onclick="cancelEdit('email')">取消</button>
                        </div>
                    </div>
                </div>

                <!-- 手機號碼 (員工可修改) -->
                <div class="info-row">
                    <span class="info-label"><i class="fas fa-phone"></i> 手機號碼</span>
                    <div class="info-action-group">
                        <div class="view-mode" id="view-phone">
                            <span class="info-value" th:text="${user.phone}">+852 1234 5678</span>
                            <!-- 僅非 CUSTOMER 角色顯示編輯按鈕 -->
                            <button class="btn-icon btn-edit" th:if="${user.role.name() != 'CUSTOMER'}"
                                th:attr="data-val=${user.phone}" onclick="toggleEdit('phone', this.dataset.val)"
                                data-tooltip="編輯">
                                <i class="fas fa-pen"></i>
                            </button>
                        </div>
                        <div class="edit-mode" id="edit-phone">
                            <input type="text" id="input-phone" class="form-input" th:value="${user.phone}">
                            <button class="btn-action btn-save" onclick="saveField('phone')">保存</button>
                            <button class="btn-action btn-cancel" onclick="cancelEdit('phone')">取消</button>
                        </div>
                    </div>
                </div>

                <!-- 工作電話 (僅員工可見與可編輯) -->
                <div class="info-row" th:if="${user.role.name() != 'CUSTOMER'}">
                    <span class="info-label"><i class="fas fa-briefcase"></i> 工作電話</span>
                    <div class="info-action-group">
                        <div class="view-mode" id="view-workPhone">
                            <span class="info-value"
                                th:text="${user.workPhone != null ? user.workPhone : '未設置'}">未設置</span>

                            <button class="btn-icon btn-edit" th:if="${user.workPhone != null}"
                                th:attr="data-val=${user.workPhone}" onclick="toggleEdit('workPhone', this.dataset.val)"
                                data-tooltip="編輯">
                                <i class="fas fa-pen"></i>
                            </button>

                            <button class="btn-icon btn-add" th:if="${user.workPhone == null}"
                                onclick="toggleEdit('workPhone', '')" data-tooltip="增加工作電話">
                                <i class="fas fa-plus"></i> 增加工作電話
                            </button>
                        </div>
                        <div class="edit-mode" id="edit-workPhone">
                            <input type="text" id="input-workPhone" class="form-input" th:value="${user.workPhone}"
                                placeholder="請輸入工作電話...">
                            <button class="btn-action btn-save" onclick="saveField('workPhone')">保存</button>
                            <button class="btn-action btn-cancel" onclick="cancelEdit('workPhone')">取消</button>
                        </div>
                    </div>
                </div>

                <!-- 統一收貨地址管理區塊 -->
                <div class="info-card">
                    <h3
                        style="margin-bottom: 1.5rem; color: var(--primary-color); display: flex; align-items: center; gap: 0.5rem;">
                        <i class="fas fa-map-marker-alt" style="color: var(--gold-color);"></i> 收貨地址管理
                    </h3>

                    <!-- 遍歷地址列表 (使用 Thymeleaf 標準的 #lists.isEmpty 判斷) -->
                    <div th:if="${not #lists.isEmpty(addresses)}">
                        <div class="info-row" th:each="addr : ${addresses}">
                            <span class="info-label"
                                style="flex-direction: column; align-items: flex-start; gap: 0.5rem;">
                                <!-- 動態生成地址標籤 -->
                                <span th:if="${addr.ranking == 1}"
                                    style="background: var(--gold-color); color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600;">主地址</span>
                                <span th:if="${addr.ranking == 2}"
                                    style="background: var(--text-secondary); color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600;">第二地址</span>
                                <span th:if="${addr.ranking > 2}" th:text="'第' + ${addr.ranking} + '地址'"
                                    style="background: var(--bg-secondary); color: var(--text-secondary); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; border: 1px solid var(--border-color);"></span>

                                <span style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.25rem;">
                                    <i class="fas fa-user"></i> <span th:text="${addr.receiverName}">收件人</span>
                                    <span style="color: var(--text-secondary);">|</span>
                                    <!-- 【修復處】：將錯誤的 < each> 修正為正確的 </span> -->
                                    <i class="fas fa-phone"></i> <span th:text="${addr.contactPhone}">聯繫電話</span>
                                </span>
                            </span>

                            <div class="info-action-group">
                                <!-- 詳細地址顯示 -->
                                <span class="info-value" th:text="${addr.fullAddress}"
                                    style="flex: 1; text-align: right; margin-right: 1rem; font-size: 0.95rem;">詳細地址內容</span>

                                <!-- 操作按鈕 -->
                                <button class="btn-icon btn-edit" th:attr="data-id=${addr.addressId},
                 data-ranking=${addr.ranking},
                 data-receiver=${addr.receiverName},
                 data-phone=${addr.contactPhone},
                 data-address=${addr.fullAddress}" onclick="openEditAddressModal(this)" data-tooltip="編輯">
                                    <i class="fas fa-pen"></i>
                                </button>

                                <!-- ranking > 1 的地址才允許刪除，保護主地址 -->
                                <button class="btn-icon"
                                    style="color: var(--error-color); border-color: var(--error-color);"
                                    th:if="${addr.ranking > 1}" th:attr="data-id=${addr.addressId}"
                                    onclick="deleteAddress(this.dataset.id)" data-tooltip="刪除">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 空狀態提示 -->
                    <div th:if="${#lists.isEmpty(addresses)}" class="info-row"
                        style="justify-content: center; color: var(--text-secondary); padding: 2rem;">
                        <p><i class="fas fa-inbox"></i> 暫無收貨地址，請點擊下方按鈕新增</p>
                    </div>

                    <!-- 新增地址按鈕 -->
                    <!-- 情況 A：還可以新增地址時，顯示新增按鈕 -->
                    <div style="margin-top: 1.5rem; text-align: center;" th:if="${canAddMoreAddresses}">
                        <button class="btn-action btn-save" onclick="openAddAddressModal()"
                            style="display: inline-flex;">
                            <i class="fas fa-plus"></i> 新增收貨地址
                        </button>
                    </div>

                    <!-- 情況 B：已達到地址數量上限時，顯示提示文字 -->
                    <div style="margin-top: 1.5rem; text-align: center;" th:unless="${canAddMoreAddresses}">
                        <p
                            style="color: var(--gray); font-size: 0.9rem; display: inline-flex; align-items: center; gap: 0.5rem;">
                            <i class="fas fa-info-circle"></i>
                            您已達到系統允許的最大收貨地址數量限制
                        </p>
                    </div>
                </div>
            </div>
            <a href="/" class="btn-back"><i class="fas fa-arrow-left"></i> 返回首頁</a>
        </main>
    </div>

    <!-- 新增收貨地址彈窗 (級聯選擇器版) -->

        <div class="custom-modal-box address-modal-box">
            <div class="modal-header">
                <h3 class="modal-title"><i class="fas fa-map-marker-alt" style="color: var(--gold-color);"></i> 新增收貨地址
                </h3>
                <button class="modal-close-btn" onclick="closeAddAddressModal()">&times;</button>
            </div>

            <form id="addAddressForm" onsubmit="submitNewAddress(event)">
                <div class="form-group-modal">
                    <label for="newReceiverName">收件人姓名 <span class="required">*</span></label>

                </div>

                </div>

    <!--  引入公共弹窗 HTML -->
    <div th:replace="~{fragments/common :: modals}"></div>

    <!--  注入登录状态变量與內聯編輯 JS 邏輯 -->
    <script th:inline="javascript">
        // 獲取 Spring Security 狀態
        const isLoggedIn = [[${#authorization.expression('isAuthenticated()')} ?: false]];

        /**
         * 切換到編輯模式
         */
        function toggleEdit(fieldName, originalValue) {
            document.getElementById('view-' + fieldName).style.display = 'none';
            document.getElementById('edit-' + fieldName).style.display = 'flex';

            const input = document.getElementById('input-' + fieldName);
            input.value = originalValue || '';
            input.focus();

            input.onkeydown = function (e) {
                if (e.key === 'Enter') saveField(fieldName);
                if (e.key === 'Escape') cancelEdit(fieldName);
            };
        }

        /**
         * 取消編輯，恢復查看模式
         */
        function cancelEdit(fieldName) {
            document.getElementById('edit-' + fieldName).style.display = 'none';
            document.getElementById('view-' + fieldName).style.display = 'flex';
        }

        /**
         * 顯示居中彈窗 (幾秒後自動消失)
         * @param {string} message - 提示文字
         * @param {string} type - 類型: 'info'(金色), 'error'(紅色), 'success'(綠色)
         */
        function showCenterToast(message, type = 'info') {
            const existing = document.querySelector('.center-toast-overlay');
            if (existing) existing.remove();

            let iconClass = 'fas fa-info-circle';
            let boxClass = '';

            if (type === 'error') {
                iconClass = 'fas fa-exclamation-circle';
                boxClass = 'toast-error';
            } else if (type === 'success') {
                iconClass = 'fas fa-check-circle';
                boxClass = 'toast-success';
            }

            const overlay = document.createElement('div');
            overlay.className = 'center-toast-overlay';
            overlay.innerHTML = `
        <div class="center-toast-box ${boxClass}">
            <div class="center-toast-icon"><i class="${iconClass}"></i></div>
            <div class="center-toast-message">${message}</div>
        </div>`;

            document.body.appendChild(overlay);

            overlay.addEventListener('click', function (e) {
                if (e.target === overlay) {
                    closeToast(overlay);
                }
            });

            setTimeout(() => {
                overlay.style.transition = 'opacity 0.3s ease';
                overlay.style.opacity = '0';
                setTimeout(() => overlay.remove(), 300);
            }, 3000);
        }

        function closeToast(overlay) {
            if (overlay && !overlay.classList.contains('closing')) {
                overlay.classList.add('closing');
                overlay.style.transition = 'opacity 0.3s ease';
                overlay.style.opacity = '0';
                setTimeout(() => overlay.remove(), 300);
            }
        }

        /**
         * 保存字段並發送 AJAX 請求
         */
        function saveField(fieldName) {
            const input = document.getElementById('input-' + fieldName);
            const newValue = input.value.trim();

            if ((fieldName === 'username' || fieldName === 'email' || fieldName === 'phone') && !newValue) {
                showCenterToast(`❌ ${getFieldLabel(fieldName)}不能為空！`, 'error');
                return;
            }

            if (fieldName === 'email' && newValue) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(newValue)) {
                    showCenterToast('❌ 電子郵件格式不正確！', 'error');
                    return;
                }
            }

            const data = {};
            data[fieldName] = newValue;

            fetch('/api/user/update-profile', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
                .then(response => response.json())
                .then(result => {
                    if (result.success) {
                        const valueSpan = document.querySelector('#view-' + fieldName + ' .info-value');
                        if (valueSpan) {
                            valueSpan.textContent = newValue || '未設置';
                        }

                        const editBtn = document.querySelector('#view-' + fieldName + ' .btn-edit');
                        const addBtn = document.querySelector('#view-' + fieldName + ' .btn-add');

                        if (newValue) {
                            if (editBtn) {editBtn.style.display = 'inline-flex'; editBtn.dataset.val = newValue;}
                            if (addBtn) addBtn.style.display = 'none';
                        } else {
                            if (editBtn) editBtn.style.display = 'none';
                            if (addBtn) addBtn.style.display = 'inline-flex';
                        }

                        cancelEdit(fieldName);

                        if (fieldName === 'username') {
                            showCenterToast('✅ 改名已成功！請使用新用戶名重新登入', 'success');
                            setTimeout(() => {
                                fetch('/logout', {method: 'POST'})
                                    .then(() => {window.location.href = '/';})
                                    .catch(() => {window.location.href = '/';});
                            }, 3000);
                        } else {
                            showCenterToast('✅ 保存成功！', 'success');
                        }
                    } else {
                        cancelEdit(fieldName);
                        if (result.message === 'SAME_USERNAME') {
                            showCenterToast('💡 新用戶名和原來一樣，無需修改', 'info');
                        } else if (result.message === 'USERNAME_EXISTS') {
                            showCenterToast('❌ 該用戶名已被註冊，請選擇別的用戶名吧', 'error');
                        } else if (result.message === 'EMAIL_EXISTS') {
                            showCenterToast('❌ 該電子郵件已被其他用戶註冊！', 'error');
                        } else if (result.message === 'PHONE_EXISTS') {
                            showCenterToast('❌ 該手機號碼已被其他用戶註冊！', 'error');
                        } else if (result.message.includes('無權修改')) {
                            showCenterToast('❌ ' + result.message, 'error');
                        } else {
                            showCenterToast('❌ ' + (result.message || '保存失敗'), 'error');
                        }
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    cancelEdit(fieldName);
                    showCenterToast('❌ 網絡錯誤，請稍後再試！', 'error');
                });
        }

        function getFieldLabel(fieldName) {
            const labels = {
                'username': '用戶名',
                'email': '電子郵件',
                'phone': '手機號碼'
            };
            return labels[fieldName] || '該字段';
        }

        // ==========================================
        //  地址級聯選擇器數據與邏輯 (新增地址用)
        // ==========================================
        const newDistrictData = {
            '港島': ['中西區', '灣仔區', '東區', '南區'],
            '九龍': ['油尖旺區', '深水埗區', '九龍城區', '黃大仙區', '觀塘區'],
            '新界': ['荃灣區', '屯門區', '元朗區', '北區', '大埔區', '西貢區', '沙田區', '葵青區', '離島區']
        };

        const newRegionSelect = document.getElementById('newRegionSelect');
        const newDistrictSelect = document.getElementById('newDistrictSelect');
        const newDetailAddressInput = document.getElementById('newDetailAddress');

        if (newRegionSelect && newDistrictSelect && newDetailAddressInput) {
            newRegionSelect.addEventListener('change', function () {
                const selectedRegion = this.value;
                newDistrictSelect.innerHTML = '<option value="">請先選擇區域</option>';
                newDistrictSelect.disabled = true;
                newDetailAddressInput.value = '';

                if (selectedRegion && newDistrictData[selectedRegion]) {
                    newDistrictSelect.disabled = false;
                    newDistrictData[selectedRegion].forEach(district => {
                        const option = document.createElement('option');
                        option.value = district;
                        option.textContent = district;
                        newDistrictSelect.appendChild(option);
                    });
                }
            });

            newDistrictSelect.addEventListener('change', function () {
                const region = newRegionSelect.value;
                const district = this.value;
                if (region && district) {
                    newDetailAddressInput.value = region + ' ' + district + ' ';
                    newDetailAddressInput.focus();
                }
            });
        }

        // ==========================================
        //  新增地址彈窗邏輯
        // ==========================================
        function openAddAddressModal() {
            const form = document.getElementById('addAddressForm');
            if (form) form.reset();

            const regionSelect = document.getElementById('newRegionSelect');
            const districtSelect = document.getElementById('newDistrictSelect');
            const detailInput = document.getElementById('newDetailAddress');

            if (regionSelect) regionSelect.value = '';
            if (districtSelect) {
                districtSelect.innerHTML = '<option value="">請先選擇區域</option>';
                districtSelect.disabled = true;
            }
            if (detailInput) detailInput.value = '';

            const modal = document.getElementById('addAddressModal');
            if (modal) {
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            }
        }

        async function submitNewAddress(event) {
            event.preventDefault();

            const receiverName = document.getElementById('newReceiverName').value.trim();
            const contactPhone = document.getElementById('newContactPhone').value.trim();

            // 【核心修復】：級聯選擇器已經自動將「區域 + 行政區」寫入到 newDetailAddress 中
            // 所以直接獲取它的值作為完整地址即可，千萬不要再手動拼接 region 和 district！
            const fullAddress = document.getElementById('newDetailAddress').value.trim();

            const isDefault = document.getElementById('isDefaultAddress').checked;

            if (!receiverName || !contactPhone || !fullAddress) {
                showCenterToast('❌ 請填寫完整的地址資訊！', 'error');
                return;
            }

            try {
                const response = await fetch('/api/user/addresses', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        receiverName: receiverName,
                        contactPhone: contactPhone,
                        fullAddress: fullAddress, // 直接使用已經拼接好的完整地址
                        isDefault: isDefault
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    showCenterToast('✅ ' + result.message, 'success');
                    closeAddAddressModal();
                    setTimeout(() => {window.location.reload();}, 1000);
                } else {
                    showCenterToast('❌ ' + (result.message || '新增失敗'), 'error');
                }
            } catch (error) {
                console.error('新增地址錯誤:', error);
                showCenterToast('❌ 網絡錯誤，請稍後再試！', 'error');
            }
        }

        function closeAddAddressModal() {
            const modal = document.getElementById('addAddressModal');
            if (modal) {
                modal.style.display = 'none';
                document.body.style.overflow = '';
            }
        }

        // ==========================================
        //  編輯地址相關邏輯 (已移除 Loading 狀態設計)
        // ==========================================
        /**
         * 打開編輯地址彈窗並填充現有數據
         */

        function openEditAddressModal(btn) {
            const addressId = btn.getAttribute('data-id');
            const ranking = btn.getAttribute('data-ranking');
            const receiver = btn.getAttribute('data-receiver');
            const phone = btn.getAttribute('data-phone');
            const address = btn.getAttribute('data-address');

            document.getElementById('editAddressId').value = addressId;
            document.getElementById('editRanking').value = ranking || 1;
            document.getElementById('editReceiverName').value = receiver || '';
            document.getElementById('editContactPhone').value = phone || '';
            document.getElementById('editFullAddress').value = address || '';

            // 【新增】获取当前最大排序值并设置max属性
            fetchMaxRanking().then(maxRanking => {
                const rankingInput = document.getElementById('editRanking');
                rankingInput.max = maxRanking;

                // 如果当前值超过最大值，调整为最大值
                if (parseInt(rankingInput.value) > maxRanking) {
                    rankingInput.value = maxRanking;
                }
            });

            const modal = document.getElementById('editAddressModal');
            if (modal) {
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            }
        }

        // 【新增】获取当前用户的最大排序值
        async function fetchMaxRanking() {
            try {
                const response = await fetch('/api/user/addresses/max-ranking', {
                    method: 'GET',
                    headers: {'Content-Type': 'application/json'}
                });

                if (response.ok) {
                    const result = await response.json();
                    return result.maxRanking || 1;
                }
            } catch (error) {
                console.error('获取最大排序值失败:', error);
            }
            return 1; // 默认值
        }

        // 【新增】在submitEditAddress中添加验证
        async function submitEditAddress(event) {
            event.preventDefault();

            const addressId = document.getElementById('editAddressId').value;
            const rankingInput = document.getElementById('editRanking');
            const newRanking = parseInt(rankingInput.value);

            // 【新增】验证排序权重
            const maxRanking = await fetchMaxRanking();
            if (newRanking > maxRanking) {
                showCenterToast(`❌ 排序权重不能超过当前最大值 ${maxRanking}！`, 'error');
                rankingInput.focus();
                return;
            }

            if (newRanking < 1) {
                showCenterToast('❌ 排序权重不能小于 1！', 'error');
                rankingInput.focus();
                return;
            }

            const payload = {
                receiverName: document.getElementById('editReceiverName').value.trim(),
                contactPhone: document.getElementById('editContactPhone').value.trim(),
                fullAddress: document.getElementById('editFullAddress').value.trim(),
                ranking: newRanking
            };

            try {
                const response = await fetch(`/api/user/addresses/${addressId}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    closeEditAddressModal();
                    showCenterToast('✅ ' + result.message, 'success');
                    setTimeout(() => {window.location.reload();}, 1000);
                } else {
                    showCenterToast('❌ ' + (result.message || '更新失败'), 'error');
                }
            } catch (error) {
                console.error('更新地址错误:', error);
                showCenterToast('❌ 网络错误，请稍后再试！', 'error');
            }
        }

        // ==========================================
        // 徹底禁止滑鼠滾輪改變 ranking 數值
        // ==========================================
        document.getElementById('editRanking').addEventListener('wheel', function (e) {
            e.preventDefault(); // 阻止滾輪默認的加減行為
        }, {passive: false});


        function closeEditAddressModal() {
            const modal = document.getElementById('editAddressModal');
            if (modal) {
                modal.style.display = 'none';
                document.body.style.overflow = '';
            }
            const form = document.getElementById('editAddressForm');
            if (form) form.reset();
        }

        // ==========================================
        //  刪除地址相關邏輯
        // ==========================================
        let pendingDeleteAddressId = null;

        function deleteAddress(addressId) {
            pendingDeleteAddressId = addressId;
            const modal = document.getElementById('deleteAddressModal');
            if (modal) {
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            }
        }

        function closeDeleteAddressModal() {
            const modal = document.getElementById('deleteAddressModal');
            if (modal) {
                modal.style.display = 'none';
                document.body.style.overflow = '';
            }
            pendingDeleteAddressId = null;
        }

        async function confirmDeleteAddress() {
            if (!pendingDeleteAddressId) return;

            try {
                const response = await fetch(`/api/user/addresses/${pendingDeleteAddressId}`, {
                    method: 'DELETE',
                    headers: {'Content-Type': 'application/json'}
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    closeDeleteAddressModal();
                    showCenterToast('✅ 地址已成功刪除！', 'success');
                    setTimeout(() => {window.location.reload();}, 1000);
                } else {
                    showCenterToast('❌ ' + (result.message || '刪除失敗'), 'error');
                }
            } catch (error) {
                console.error('刪除地址錯誤:', error);
                showCenterToast('❌ 網絡錯誤，請稍後再試！', 'error');
            }
        }

        // ==========================================
        //  全局事件監聽 (遮罩層點擊與 ESC 鍵)
        // ==========================================
        document.getElementById('addAddressModal')?.addEventListener('click', function (e) {
            if (e.target === this) closeAddAddressModal();
        });

        document.getElementById('editAddressModal')?.addEventListener('click', function (e) {
            if (e.target === this) closeEditAddressModal();
        });

        document.getElementById('deleteAddressModal')?.addEventListener('click', function (e) {
            if (e.target === this) closeDeleteAddressModal();
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                const addModal = document.getElementById('addAddressModal');
                if (addModal && addModal.style.display === 'flex') closeAddAddressModal();

                const editModal = document.getElementById('editAddressModal');
                if (editModal && editModal.style.display === 'flex') closeEditAddressModal();

                const deleteModal = document.getElementById('deleteAddressModal');
                if (deleteModal && deleteModal.style.display === 'flex') closeDeleteAddressModal();
            }
        });
    </script>

    <!--  引入公共 JS -->
    <script src="/js/common.js"></script>

</body>
