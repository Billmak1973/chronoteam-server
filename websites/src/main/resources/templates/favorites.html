<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏 - ChronoTeam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <style>
        /* 佈局相關 */
        .dashboard-container {
            display: flex;
            min-height: calc(100vh - 150px);
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1rem;
            gap: 2rem;
        }

        .main-content {
            flex: 1;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 2.5rem;
        }

        .page-title {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            border-bottom: 2px solid var(--light);
            padding-bottom: 1rem;
        }

        .page-title i {
            color: var(--accent);
        }

        /* 愛心使用紅色/粉色系 */
        .page-subtitle {
            color: var(--gray);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        /*  收藏網格佈局 */
        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .favorite-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
        }

        .favorite-card:hover {
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            transform: translateY(-5px);
        }

        .fav-img {
            height: 200px;
            background: var(--light);
            overflow: hidden;
            position: relative;
        }

        .fav-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .favorite-card:hover .fav-img img {
            transform: scale(1.08);
        }

        .fav-info {
            padding: 1.2rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .fav-brand {
            color: var(--gold);
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
        }

        .fav-name {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.8rem;
            font-size: 1rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 2.8em;
        }

        .fav-price {
            color: var(--accent);
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            margin-top: auto;
        }

        .fav-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-sm {
            padding: 0.5rem 0.8rem;
            font-size: 0.85rem;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            justify-content: center;
            flex: 1;
            font-weight: 500;
        }

        .btn-view {
            background: var(--light);
            color: var(--primary);
            border: 1px solid #ddd;
        }

        .btn-view:hover {
            background: var(--gold);
            color: white;
            border-color: var(--gold);
        }

        .btn-remove {
            background: #fff5f5;
            color: var(--accent);
            border: 1px solid #f8d7da;
        }

        .btn-remove:hover {
            background: var(--accent);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .empty-state i {
            font-size: 4rem;
            color: #ddd;
            margin-bottom: 1rem;
        }

        .footer {
            background: var(--primary);
            color: rgba(255, 255, 255, 0.7);
            padding: 2rem;
            text-align: center;
            margin-top: 3rem;
        }

        /* === 智能分页组件样式 === */
        .pagination-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid #f1f3f5;
        }

        .page-ellipsis {
            padding: 0.6rem 0.5rem;
            color: var(--gray);
            font-weight: bold;
            letter-spacing: 2px;
            user-select: none;
        }

        @media (max-width: 900px) {
            .dashboard-container {
                flex-direction: column;
            }
        }

        /* ========================================== */
        /*   自定義確認彈窗樣式 (取代原生 confirm)      */
        /* ========================================== */
        .custom-confirm-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            /* 毛玻璃效果 */
            z-index: 9999;
            display: none;
            /* 默認隱藏 */
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .custom-confirm-box {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-top: 4px solid var(--accent);
            /* 頂部紅色裝飾條 */
        }

        .confirm-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%);
            color: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 4px 10px rgba(233, 69, 96, 0.2);
        }

        .confirm-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.8rem;
        }

        .confirm-message {
            font-size: 0.95rem;
            color: var(--gray);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .confirm-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .btn-confirm-cancel,
        .btn-confirm-delete {
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            font-size: 0.95rem;
            min-width: 100px;
        }

        .btn-confirm-cancel {
            background: #f1f3f5;
            color: #495057;
        }

        .btn-confirm-cancel:hover {
            background: #e9ecef;
            transform: translateY(-2px);
        }

        .btn-confirm-delete {
            background: linear-gradient(135deg, var(--accent) 0%, #c73e54 100%);
            color: white;
            box-shadow: 0 4px 10px rgba(233, 69, 96, 0.3);
        }

        .btn-confirm-delete:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(233, 69, 96, 0.4);
        }

        /* 動畫定義 */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/common :: navbar}"></div>

    <div class="dashboard-container">
        <!--  引入側邊欄，高亮 'favorites' -->
        <div th:replace="~{fragments/sidebar :: sidebar(activePage='favorites')}"></div>

        <main class="main-content">
            <h2 class="page-title"><i class="fas fa-heart"></i> 我的收藏</h2>
            <p class="page-subtitle">您收藏的心儀手錶都在這裡，隨時可以查看詳情或取消收藏</p>

            <!--  收藏列表 -->
            <div class="favorites-grid" th:if="${!favorites.isEmpty()}">
                <div class="favorite-card" th:each="fav : ${favorites}">
                    <div class="fav-img">
                        <img th:src="@{/images/products/{img}(img=${fav.product.image})}"
                            th:alt="${fav.product.description}" onerror="this.src='/images/placeholder.png'">
                    </div>
                    <div class="fav-info">
                        <div class="fav-brand" th:text="${fav.product.brand} ?: 'ChronoTeam'">Brand</div>
                        <div class="fav-name" th:text="${fav.product.description}">Product Name</div>
                        <div class="fav-price">
                            HK$ <span
                                th:text="${#numbers.formatDecimal(fav.product.price, 1, 'COMMA', 0, 'POINT')}">0</span>
                        </div>
                        <div class="fav-actions">
                            <a th:href="@{/product/{id}(id=${fav.product.productId})}" class="btn-sm btn-view">
                                <i class="fas fa-eye"></i> 查看
                            </a>
                            <!--  取消收藏按鈕 -->
                            <button class="btn-sm btn-remove" th:data-product-id="${fav.product.productId}"
                                onclick="removeFavorite(this.dataset.productId, this)">
                                <i class="fas fa-heart-broken"></i> 取消
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!--  空狀態 -->
            <div th:if="${favorites.isEmpty()}" class="empty-state">
                <i class="fas fa-heart-broken"></i>
                <h3 style="color: var(--primary); margin-bottom: 0.5rem;">您還沒有收藏任何商品</h3>
                <p style="color: var(--gray); margin-bottom: 1.5rem;">去瀏覽商品，把喜歡的手錶加入收藏夾吧！</p>
                <a href="/browse" class="btn btn-gold"><i class="fas fa-search"></i> 瀏覽商品</a>
            </div>

            <!-- ==================== 智能分頁導航 (優化版) ==================== -->
            <div class="pagination-wrapper">

                <!-- 上一頁按鈕 (確保 page 參數 >= 1) -->
                <a th:href="@{/account/favorites(page=${currentPage > 1 ? currentPage - 1 : 1})}"
                    th:class="${currentPage <= 1} ? 'page-btn disabled' : 'page-btn'">
                    <i class="fas fa-chevron-left"></i> 上一頁
                </a>

                <!-- 智能頁碼遍歷 (核心邏輯 - 適配 PaginationUtils) -->
                <!-- PaginationUtils 返回的 pageNumber 是 1-based，與 currentPage 一致 -->
                <th:block th:each="item : ${smartPages}">
                    <!-- 如果是省略號 "..." -->
                    <span th:if="${item.isEllipsis}" class="page-ellipsis">...</span>

                    <!-- 如果是數字頁碼 -->
                    <a th:unless="${item.isEllipsis}" th:href="@{/account/favorites(page=${item.pageNumber})}"
                        th:class="${item.pageNumber == currentPage} ? 'page-btn active' : 'page-btn'"
                        th:text="${item.pageNumber}">1</a>
                </th:block>

                <!-- 下一頁按鈕 (確保 page 參數 <= totalPages) -->
                <a th:href="@{/account/favorites(page=${currentPage < totalPages ? currentPage + 1 : totalPages})}"
                    th:class="${currentPage >= totalPages} ? 'page-btn disabled' : 'page-btn'">
                    下一頁 <i class="fas fa-chevron-right"></i>
                </a>

            </div>
        </main>
    </div>

    <!-- ========================================== -->
    <!--   自定義取消收藏確認彈窗                   -->
    <!-- ========================================== -->
    <div id="removeFavoriteModal" class="custom-confirm-overlay">
        <div class="custom-confirm-box">
            <div class="confirm-icon">
                <i class="fas fa-heart-broken"></i>
            </div>
            <h3 class="confirm-title">確定要取消收藏嗎？</h3>
            <p class="confirm-message">取消後，該商品將從您的收藏列表中移除。<br>您隨時可以重新收藏它。</p>
            <div class="confirm-actions">
                <button class="btn-confirm-cancel" onclick="closeRemoveFavoriteModal()">再想想</button>
                <button class="btn-confirm-delete" id="confirmRemoveBtn">確認取消</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2026</span> ChronoTeam. All
            Rights Reserved.</p>
    </footer>

    <div th:replace="~{fragments/common :: modals}"></div>
    <script th:inline="javascript">
        const isLoggedIn = [[${#authorization.expression('isAuthenticated()')} ?: false]];
    </script>
    <script src="/js/common.js"></script>

    <!--  取消收藏專屬 JS -->
    <!--  取消收藏專屬 JS -->
    <script>
        // ==========================================
        // 全局變量：暫存當前要操作的商品 ID 和按鈕元素
        // ==========================================
        let pendingRemoveProductId = null;
        let pendingRemoveBtn = null;

        // ==========================================
        // 1. 觸發刪除 (取代原有的 removeFavorite)
        // ==========================================
        function removeFavorite(productId, btn) {
            // 暫存數據
            pendingRemoveProductId = productId;
            pendingRemoveBtn = btn;

            // 顯示自定義彈窗
            const modal = document.getElementById('removeFavoriteModal');
            if (modal) {
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden'; // 禁止背景滾動
            }
        }

        // ==========================================
        // 2. 關閉彈窗
        // ==========================================
        function closeRemoveFavoriteModal() {
            const modal = document.getElementById('removeFavoriteModal');
            if (modal) {
                modal.style.display = 'none';
                document.body.style.overflow = ''; // 恢復背景滾動
            }
            // 【注意】這裡清空了全局變量，所以在調用此函數前必須先保存引用
            pendingRemoveProductId = null;
            pendingRemoveBtn = null;
        }

        // ==========================================
        // 3. 執行真正的刪除邏輯 (綁定在彈窗的確認按鈕上)
        // ==========================================
        document.getElementById('confirmRemoveBtn').addEventListener('click', async function () {
            if (!pendingRemoveProductId || !pendingRemoveBtn) return;

            // 【核心修復 1】：在關閉彈窗（清空變量）之前，先將按鈕引用保存到局部變量
            const currentBtn = pendingRemoveBtn;
            const currentProductId = pendingRemoveProductId;

            const originalText = this.innerHTML;

            // 按鈕進入 Loading 狀態
            this.disabled = true;
            this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 處理中...';

            try {
                const response = await fetch(`/api/favorites/toggle/${currentProductId}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // 1. 先關閉彈窗 (這會清空 pendingRemoveBtn，但我們已經有 currentBtn 了)
                    closeRemoveFavoriteModal();

                    // 2. 顯示成功提示
                    if (typeof showNotification === 'function') {
                        showNotification('💔 已取消收藏');
                    }

                    // 3. 執行優雅的消失動畫 (使用局部變量 currentBtn)
                    const card = currentBtn.closest('.favorite-card');
                    if (card) {
                        card.style.transition = 'all 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
                        card.style.opacity = '0';
                        card.style.transform = 'scale(0.8) translateY(20px)';

                        // 動畫結束後移除 DOM 並刷新分頁
                        setTimeout(() => {
                            card.remove();
                            // 【重要】SSR 模式下，刪除後必須刷新頁面以更新分頁數據
                            // 因為分頁數據 (totalPages, smartPages) 是在服務器端計算的
                            setTimeout(() => location.reload(), 300);
                        }, 400);
                    } else {
                        // 如果找不到卡片元素，直接刷新
                        location.reload();
                    }
                } else {
                    // 失敗處理
                    if (typeof showNotification === 'function') {
                        showNotification('❌ ' + (result.message || '操作失敗'), true);
                    }
                    // 恢復按鈕狀態
                    this.disabled = false;
                    this.innerHTML = originalText;
                }
            } catch (error) {
                console.error('取消收藏錯誤:', error);
                if (typeof showNotification === 'function') {
                    showNotification('❌ 網絡錯誤', true);
                }
                // 恢復按鈕狀態
                this.disabled = false;
                this.innerHTML = originalText;
            }
        });

        // ==========================================
        // 4. 點擊遮罩層也可以關閉彈窗
        // ==========================================
        document.getElementById('removeFavoriteModal').addEventListener('click', function (e) {
            if (e.target === this) {
                closeRemoveFavoriteModal();
            }
        });

        // ==========================================
        // 5. 按 ESC 鍵也可以關閉彈窗
        // ==========================================
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                const modal = document.getElementById('removeFavoriteModal');
                if (modal && modal.style.display === 'flex') {
                    closeRemoveFavoriteModal();
                }
            }
        });
    </script>
</body>

</html>
