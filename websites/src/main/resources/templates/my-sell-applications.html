<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的出售申請 - ChronoTeam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/sidebar.css">

    <style>
        /* 佈局相關 */
        .dashboard-container {
            display: flex;
            min-height: calc(100vh - 150px);
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1rem;
            gap: 2rem;
        }

        .main-content {
            flex: 1;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 2.5rem;
        }

        .page-title {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            border-bottom: 2px solid var(--light);
            padding-bottom: 1rem;
        }

        .page-title i {
            color: var(--gold);
        }

        .page-subtitle {
            color: var(--gray);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        /* 【新增】財務統計卡片樣式（從結算記錄頁面移過來） */
        .finance-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .finance-card {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            transition: transform 0.3s;
            position: relative;
            overflow: hidden;
        }

        .finance-card:hover {
            transform: translateY(-3px);
        }

        .finance-card::before {
            content: '';
            position: absolute;
            top: -30px;
            right: -30px;
            width: 100px;
            height: 100px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 50%;
        }

        .finance-card i {
            font-size: 2rem;
            color: var(--gold);
            background: rgba(255, 255, 255, 0.1);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }

        .finance-info h4 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .finance-info p {
            margin: 0.2rem 0 0;
            font-size: 0.85rem;
            opacity: 0.8;
        }

        /* 卡片與列表樣式 */
        .card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s;
        }

        .card:hover {
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .empty-state i {
            font-size: 4rem;
            color: #ddd;
            margin-bottom: 1rem;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .app-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* 狀態標籤 */
        .status-badge {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-PENDING {
            background: #fff3cd;
            color: #856404;
        }

        .status-APPRAISING {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-QUOTED {
            background: #cce5ff;
            color: #004085;
        }

        .status-ACCEPTED {
            background: #d4edda;
            color: #155724;
        }

        .status-REJECTED {
            background: #f8d7da;
            color: #721c24;
        }

        .status-COMPLETED {
            background: #d4edda;
            color: #155724;
        }

        .status-CANCELLED {
            background: #e2e3e5;
            color: #383d41;
        }

        .app-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            color: var(--gray);
            font-size: 0.95rem;
        }

        .app-details span {
            display: block;
            font-weight: 600;
            color: var(--primary);
            margin-top: 0.2rem;
        }

        .footer {
            background: var(--primary);
            color: rgba(255, 255, 255, 0.7);
            padding: 2rem;
            text-align: center;
            margin-top: 3rem;
        }

        /* 響應式 */
        @media (max-width: 900px) {
            .dashboard-container {
                flex-direction: column;
            }
        }

        /* ========================================== */
        /* 自定義取消確認彈窗 (取代原生 confirm) */
        /* ========================================== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(3px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-box {
            background: white;
            border-radius: 16px;
            padding: 2.5rem 2rem 2rem;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .modal-overlay.show .modal-box {
            animation: modalPop 0.25s ease;
        }

        @keyframes modalPop {
            from {
                transform: scale(0.85);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 1.2rem;
            border-radius: 50%;
            background: #f8d7da;
            color: #dc3545;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }

        .modal-box h3 {
            color: var(--primary);
            font-size: 1.3rem;
            margin-bottom: 0.6rem;
        }

        .modal-box p {
            color: var(--gray);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.8rem;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .modal-btn {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .modal-btn.cancel {
            background: #e9ecef;
            color: var(--primary);
        }

        .modal-btn.cancel:hover {
            background: #dee2e6;
        }

        .modal-btn.confirm {
            background: #dc3545;
            color: white;
        }

        .modal-btn.confirm:hover {
            background: #bb2d3b;
            transform: translateY(-2px);
        }

        .modal-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/common :: navbar}"></div>

    <div class="dashboard-container">
        <div th:replace="~{fragments/sidebar :: sidebar(activePage='sell-applications')}"></div>

        <main class="main-content">
            <h2 class="page-title"><i class="fas fa-list-alt"></i> 我的出售申請</h2>
            <p class="page-subtitle">查看您提交的手錶出售申請進度與鑑定狀態</p>

            <!-- 【新增】財務統計卡片（從結算記錄頁面移過來） -->
            <div class="finance-grid" th:if="${totalRevenue != null or settledCount != null}">
                <div class="finance-card">
                    <i class="fas fa-coins"></i>
                    <div class="finance-info">
                        <!-- 後端已保證 totalRevenue 不為 null，直接格式化即可，不會報錯 -->
                        <h4 th:text="'HK$ ' + ${#numbers.formatDecimal(totalRevenue, 1, 'COMMA', 0, 'POINT')}">HK$ 0
                        </h4>
                        <p>累計總成交額</p>
                    </div>
                </div>

                <!-- 已結算申請數量（替換了原本的實際淨收益） -->
                <div class="finance-card" style="background: linear-gradient(135deg, #155724 0%, #28a745 100%);">
                    <i class="fas fa-check-circle" style="color: white; background: rgba(255,255,255,0.2);"></i>
                    <div class="finance-info">
                        <h4 th:text="${settledCount != null ? settledCount : 0}">0</h4>
                        <p>已結算申請數量</p>
                    </div>
                </div>
            </div>

            <!-- 申請列表 -->
            <div th:if="${applications != null and !applications.content.isEmpty()}">
                <div class="card" th:each="app : ${applications.content}">
                    <div class="app-header">
                        <div class="app-title">
                            <i class="fas fa-clock" style="color: var(--gold);"></i>
                            <span th:text="${app.brand}">Brand</span> - <span th:text="${app.series}">Series</span>
                        </div>

                        <div style="display: flex; align-items: center; gap: 1rem;">
                            <span class="status-badge" th:classappend="'status-' + ${app.status}"
                                th:text="${app.status}">PENDING</span>

                            <button th:if="${app.status.name() == 'PENDING'}"
                                th:onclick="|cancelApplication(${app.applicationId})|"
                                style="padding: 0.3rem 0.8rem; font-size: 0.8rem; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; border-radius: 6px; cursor: pointer; transition: all 0.2s;"
                                onmouseover="this.style.background='#f1aeb5'"
                                onmouseout="this.style.background='#f8d7da'">
                                <i class="fas fa-times"></i> 取消申請
                            </button>
                        </div>
                    </div>
                    <div class="app-details">
                        <div>型號：<span th:text="${app.model} ?: '未填寫'">-</span></div>
                        <div>購買年份：<span th:text="${app.purchaseYear}">-</span></div>
                        <div>件數：<span th:text="${app.quantity} ?: 1">1</span></div>
                        <div>交易模式：
                            <span style="color: var(--gold); font-weight: 600;">平台直接買斷</span>
                        </div>
                        <div>提交時間：<span th:text="${#temporals.format(app.createdAt, 'yyyy-MM-dd HH:mm')}">-</span></div>
                        <!-- 【新增】線下預約交接資訊 (僅在有預約日期時顯示) -->
                        <div th:if="${app.appointmentDate != null}"
                            style="grid-column: 1 / -1; margin-top: 0.8rem; padding-top: 1rem; border-top: 1px dashed #e9ecef;">
                            <div
                                style="color: var(--primary); font-weight: 600; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem;">
                                <i class="fas fa-store" style="color: var(--gold);"></i> 線下預約交接資訊
                            </div>
                            <div
                                style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; color: var(--gray); font-size: 0.9rem;">
                                <div>預約門店：<span style="color: var(--primary);"
                                        th:text="${storeMap[app.storeId]} ?: '未指定'">-</span></div>
                                <div>預約日期：<span style="color: var(--primary);"
                                        th:text="${#temporals.format(app.appointmentDate, 'yyyy-MM-dd')}">-</span></div>
                                <div>預約時間：<span style="color: var(--primary);"
                                        th:text="${app.appointmentTimeSlot} ?: '未指定'">-</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 空狀態 -->
            <div th:if="${applications == null or applications.content.isEmpty()}" class="card empty-state">
                <i class="fas fa-inbox"></i>
                <h3 style="color: var(--primary); margin-bottom: 0.5rem;">您還沒有提交過出售申請</h3>
                <p style="color: var(--gray); margin-bottom: 1.5rem;">立即發佈您的愛錶，獲取專業免費估價！</p>
                <a href="/sell" class="btn btn-gold"><i class="fas fa-plus-circle"></i> 發佈出售申請</a>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="cancelModalOverlay" onclick="if(event.target === this) closeCancelModal()">
        <div class="modal-box">
            <div class="modal-icon"><i class="fas fa-exclamation-triangle"></i></div>
            <h3>確定要取消此出售申請嗎？</h3>
            <p>取消後，該申請將被標記為「已取消」狀態，<br>鑑定流程將同時終止。</p>
            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closeCancelModal()">
                    <i class="fas fa-arrow-left"></i> 返回
                </button>
                <button class="modal-btn confirm" id="confirmCancelBtn" onclick="confirmCancel()">
                    <i class="fas fa-times"></i> 確認取消
                </button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2026</span> ChronoTeam. All
            Rights Reserved.</p>
    </footer>

    <div th:replace="~{fragments/common :: modals}"></div>
    <script th:inline="javascript">
        const isLoggedIn = [[${#authorization.expression('isAuthenticated()')} ?: false]];
    </script>
    <script src="/js/common.js"></script>

    <script>
        // 暫存等待取消的申請 ID
        let pendingCancelId = null;

        // 打開自定義彈窗 (不再使用原生 confirm)
        function cancelApplication(applicationId) {
            pendingCancelId = applicationId;
            document.getElementById('cancelModalOverlay').classList.add('show');
            document.body.style.overflow = 'hidden'; // 鎖定背景滾動
        }

        // 關閉彈窗
        function closeCancelModal() {
            pendingCancelId = null;
            document.getElementById('cancelModalOverlay').classList.remove('show');
            document.body.style.overflow = ''; // 恢復背景滾動
        }

        // 點擊「確認取消」後才真正發送請求
        async function confirmCancel() {
            if (pendingCancelId === null) return;

            try {
                const response = await fetch(`/sell/cancel/${pendingCancelId}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    closeCancelModal();
                    showNotification('✅ 申請已取消');
                    setTimeout(() => location.reload(), 1000);
                } else {
                    showNotification('❌ ' + (result.message || '取消失敗'), true);
                }
            } catch (error) {
                console.error('取消申请错误:', error);
                showNotification('❌ 網絡錯誤，請稍後重試', true);
            }
        }

        // 支援按 ESC 鍵關閉彈窗
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeCancelModal();
        });
    </script>
</body>

</html>
