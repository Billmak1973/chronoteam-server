<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貨物訂閲 - ChronoTeam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <style>
        /* 頁面佈局 */
        .account-container {
            display: flex;
            gap: 2rem;
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1rem;
            /* 【核心修改 1】：設定最小高度為視窗高度減去上下邊距，確保容器夠高 */
            min-height: calc(100vh - 4rem);
            align-items: stretch;
            /* 讓子元素（側邊欄和主內容）拉伸到相同高度 */
        }

        .main-content {
            flex: 1;
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            /* 【核心修改 2】：移除固定的 min-height: 600px，改用 Flex 佈局自動填滿 */
            display: flex;
            flex-direction: column;
            /* 垂直排列內部元素 */
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--light);
            flex-shrink: 0;
            /* 防止頭部被壓縮 */
        }

        .page-title {
            font-size: 1.8rem;
            color: var(--primary);
            margin: 0;
        }

        .page-title i {
            color: var(--gold);
            margin-right: 0.5rem;
        }

        .notification-count {
            background: var(--gold);
            color: white;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* 【核心修改 3】：新增一個包裹層，讓它佔滿中間所有空間，把分頁器擠下去 */
        .content-wrapper {
            flex: 1;
            /* 佔滿除 Header 和 Pagination 之外的所有空間 */
            display: flex;
            flex-direction: column;
        }

        /*  商品網格佈局 (3列) */
        .notifications-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
            /* 不需要 flex: 1，因為它只需要顯示內容，由 content-wrapper 負責撐開高度 */
        }

        /* 商品卡片 */
        .notification-card {
            background: white;
            border: 2px solid var(--light);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            /* 讓卡片內部也能 flex 佈局，確保按鈕在底部 */
            flex-direction: column;
        }

        .notification-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            border-color: var(--gold);
        }

        .notification-card.out-of-stock {
            opacity: 0.9;
        }

        .notification-card.in-stock {
            border-color: #28a745;
            background: linear-gradient(135deg, #f8fff8 0%, white 100%);
        }

        /* 到貨標籤 */
        .stock-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            z-index: 10;
        }

        .stock-badge.out-of-stock {
            background: #dc3545;
            color: white;
        }

        .stock-badge.in-stock {
            background: #28a745;
            color: white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        /* 商品圖片 */
        .notification-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: #f8f9fa;
        }

        /* 商品信息 */
        .notification-info {
            padding: 1rem;
            flex: 1;
            /* 讓信息區域填滿卡片剩餘空間 */
            display: flex;
            flex-direction: column;
        }

        .notification-brand {
            font-size: 0.85rem;
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .notification-name {
            font-size: 1rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 0.5rem;
            line-height: 1.4;
            /* 移除固定高度，改用 flex 自動適應，或者保留 min-height */
            min-height: 2.8rem;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .notification-price {
            font-size: 1.3rem;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .notification-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--gray);
            margin-bottom: 1rem;
            margin-top: auto;
            /* 【關鍵】：將 meta 和按鈕推到卡片底部 */
        }

        .subscribed-date {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        /* 按鈕組 */
        .notification-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: auto;
            /* 【關鍵】：確保按鈕始終在卡片最底部 */
        }

        .btn-sm {
            flex: 1;
            padding: 0.6rem;
            font-size: 0.85rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
        }

        .btn-view {
            background: var(--primary);
            color: white;
        }

        .btn-view:hover {
            background: var(--gold);
        }

        .btn-cancel {
            background: var(--light);
            color: var(--primary);
        }

        .btn-cancel:hover {
            background: #dc3545;
            color: white;
        }

        .btn-buy {
            background: #28a745;
            color: white;
        }

        .btn-buy:hover {
            background: #218838;
        }

        /* 空狀態 */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--gray);
            flex: 1;
            /* 讓空狀態也填滿空間，居中顯示 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--light);
            margin-bottom: 1rem;
        }

        .empty-state h3 {
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        /* 分頁 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: auto;
            /* 【核心修改 4】：使用 margin-top: auto 將分頁器推到 .main-content 的最底部 */
            padding-top: 2rem;
            border-top: 1px solid #f1f3f5;
            /* 加一條分隔線更美觀 */
        }

        .pagination button {
            padding: 0.6rem 1rem;
            border: 2px solid var(--light);
            background: white;
            color: var(--primary);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .pagination button:hover:not(:disabled) {
            border-color: var(--gold);
            color: var(--gold);
        }

        .pagination button.active {
            background: var(--gold);
            border-color: var(--gold);
            color: white;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-info {
            margin: 0 1rem;
            color: var(--gray);
            font-size: 0.9rem;
        }

        /* 響應式 */
        @media (max-width: 1024px) {
            .notifications-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .notifications-grid {
                grid-template-columns: 1fr;
            }

            .account-container {
                flex-direction: column;
                min-height: auto;
                /* 手機版取消最小高度限制 */
            }

            .main-content {
                min-height: 600px;
                /* 手機版恢復最小高度 */
            }
        }

        .footer {
            background: var(--primary);
            color: rgba(255, 255, 255, 0.7);
            padding: 2rem;
            text-align: center;
            margin-top: 3rem;
        }

        /* ========================================== */
        /*  取消訂閱確認彈窗樣式 (黑金奢華風) */
        /* ========================================== */
        .unsubscribe-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            /* 毛玻璃效果 */
            -webkit-backdrop-filter: blur(5px);
            z-index: 10000;
            display: none;
            /* 默認隱藏 */
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .unsubscribe-modal-box {
            background: white;
            width: 90%;
            max-width: 420px;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border-top: 5px solid var(--gold);
            /* 頂部金色裝飾條 */
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        /* 頂部光暈裝飾 */
        .unsubscribe-modal-box::before {
            content: '';
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 100px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        .unsubscribe-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, #fff3cd 0%, #ffeeba 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.2);
            animation: iconPulse 2s infinite;
        }

        .unsubscribe-icon i {
            font-size: 2rem;
            color: #d39e00;
            /* 深金色 */
        }

        .unsubscribe-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .unsubscribe-message {
            font-size: 1rem;
            color: var(--gray);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .unsubscribe-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .btn-unsubscribe-cancel,
        .btn-unsubscribe-confirm {
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            font-size: 0.95rem;
            min-width: 120px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-unsubscribe-cancel {
            background: #f1f3f5;
            color: var(--primary);
        }

        .btn-unsubscribe-cancel:hover {
            background: #e9ecef;
            transform: translateY(-2px);
        }

        .btn-unsubscribe-confirm {
            background: linear-gradient(135deg, var(--accent) 0%, #c73e54 100%);
            /* 紅色漸變表示刪除/取消 */
            color: white;
            box-shadow: 0 4px 12px rgba(233, 69, 96, 0.3);
        }

        .btn-unsubscribe-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(233, 69, 96, 0.4);
        }

        /* 動畫定義 */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes iconPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/common :: navbar}"></div>
    <div class="account-container">
        <!-- 左側側邊欄 -->
        <div th:replace="~{fragments/sidebar :: sidebar(activePage='stock-notifications')}"></div>

        <!-- 右側主內容 -->
        <main class="main-content">
            <div class="page-header">
                <h2 class="page-title">
                    <i class="fas fa-bell"></i> 到貨通知
                </h2>
                <span class="notification-count" id="totalCount">共 <span th:text="${totalElements}">0</span> 件商品</span>
            </div>

            <!-- 【核心修改】：新增 content-wrapper 包裹層 -->
            <div class="content-wrapper">
                <!--  商品網格 -->
                <div class="notifications-grid" id="notificationsGrid" th:if="${!#lists.isEmpty(notifications)}">
                    <!-- Thymeleaf 渲染商品 -->
                    <div th:each="notification : ${notifications}" class="notification-card"
                        th:classappend="${notification.product.stock > 0} ? 'in-stock' : 'out-of-stock'"
                        th:data-product-id="${notification.product.productId}">

                        <!-- 庫存狀態標籤 -->
                        <span class="stock-badge"
                            th:classappend="${notification.product.stock > 0} ? 'in-stock' : 'out-of-stock'"
                            th:text="${notification.product.stock > 0} ? '✅ 已到貨' : '⏳ 缺貨中'">
                        </span>

                        <!--  修正 1：商品圖片 -->
                        <img th:src="@{/images/products/{img}(img=${notification.product.image})}" alt="商品圖片"
                            class="notification-image" onerror="this.src='/images/placeholder-watch.jpg'">

                        <!-- 商品信息 -->
                        <div class="notification-info">
                            <div class="notification-brand" th:text="${notification.product.brand}">品牌</div>
                            <!--  修正 2：商品名稱 -->
                            <div class="notification-name" th:text="${notification.product.description}">商品名稱</div>
                            <div class="notification-price">
                                HK$ <span
                                    th:text="${#numbers.formatDecimal(notification.product.price, 0, 'COMMA', 2, 'POINT')}">0.00</span>
                            </div>
                            <div class="notification-meta">
                                <span class="subscribed-date">
                                    <i class="fas fa-clock"></i>
                                    <span
                                        th:text="${#temporals.format(notification.createdAt, 'yyyy-MM-dd HH:mm')}">訂閱時間</span>
                                </span>
                                <span th:if="${notification.notified}" style="color: #28a745;">
                                    <i class="fas fa-check-circle"></i> 已通知
                                </span>
                            </div>

                            <!-- 按鈕組 -->
                            <div class="notification-actions">
                                <a th:href="'/product/' + ${notification.product.productId}" class="btn-sm btn-view"
                                    th:onclick="'clearStockNotification(event, ' + ${notification.product.productId} + ')'">
                                    <i class="fas fa-eye"></i> 查看
                                </a>

                                <!-- 已到貨：顯示購買按鈕 -->
                                <a th:if="${notification.product.stock > 0}"
                                    th:href="'/product/' + ${notification.product.productId}" class="btn-sm btn-buy">
                                    <i class="fas fa-shopping-cart"></i> 購買
                                </a>

                                <!-- 取消訂閱按鈕 -->
                                <button th:if="${notification.product.stock == 0}" class="btn-sm btn-cancel"
                                    th:data-id="${notification.stockNotificationId}" onclick="cancelNotification(this)">
                                    <i class="fas fa-times"></i> 取消
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 空狀態 -->
                <div th:if="${#lists.isEmpty(notifications)}" class="empty-state">
                    <i class="fas fa-bell-slash"></i>
                    <h3>暫無到貨通知</h3>
                    <p>您還沒有訂閱任何商品，去瀏覽商品並點擊「到貨通知」吧！</p>
                    <a href="/browse" class="btn btn-primary" style="margin-top: 1rem;">
                        <i class="fas fa-search"></i> 瀏覽商品
                    </a>
                </div>
            </div>
            <!-- 分頁組件：始終顯示 (當有數據時)，智能頁碼 -->
            <!-- ========================================== -->
            <!-- 【核心修改】：引用分頁 Fragment -->
            <!-- ========================================== -->
            <!--
                參數說明：
                - currentPage: 當前頁 (0-based)
                - totalPages: 總頁數
                - smartPages: 後端傳來的智能分頁列表
                - 'changePage': 對應下方 JS 中的函數名
            -->
            <div th:replace="~{fragments/pagination :: smartPagination(
                currentPage=${currentPage},
                totalPages=${totalPages},
                smartPages=${smartPages},
                changePageFunction='changePage'
            )}"></div>


        </main>
    </div>

    <!-- 取消訂閱確認彈窗 -->
    <div id="unsubscribeModal" class="unsubscribe-modal-overlay">
        <div class="unsubscribe-modal-box">
            <div class="unsubscribe-icon">
                <i class="fas fa-bell-slash"></i>
            </div>
            <h3 class="unsubscribe-title">取消到貨通知？</h3>
            <p class="unsubscribe-message">
                確定要取消這個商品的到貨通知嗎？<br>
                取消後，當商品補貨時您將不再收到提醒。
            </p>
            <div class="unsubscribe-actions">
                <button class="btn-unsubscribe-cancel" onclick="closeUnsubscribeModal()">
                    <i class="fas fa-times"></i> 再想想
                </button>
                <button class="btn-unsubscribe-confirm" id="confirmUnsubscribeBtn" onclick="executeUnsubscribe()">
                    <i class="fas fa-check"></i> 確認取消
                </button>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/common :: modals}"></div>

    <footer class="footer">
        <p>&copy; <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2026</span> ChronoTeam. All
            Rights Reserved.</p>
    </footer>

    <script
        th:inline="javascript">const isLoggedIn = [[${#authorization.expression('isAuthenticated()')} ?: false]]; </script>
    <script src="/js/common.js"></script>
    <script>
        // 分頁跳轉
        function changePage(page) {
            window.location.href = `/account/stock-notifications?page=${page}&size=12`;
        }

        // 取消訂閱
        // 全局變量：存儲當前要取消的按鈕元素
        let currentUnsubscribeBtn = null;

        // 1. 修改原有的 cancelNotification 函數：只負責打開彈窗
        function cancelNotification(btn) {
            currentUnsubscribeBtn = btn;
            const modal = document.getElementById('unsubscribeModal');
            if (modal) {
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden'; // 禁止背景滾動
            }
        }

        // 2. 關閉彈窗函數
        function closeUnsubscribeModal() {
            const modal = document.getElementById('unsubscribeModal');
            if (modal) {
                modal.style.display = 'none';
                document.body.style.overflow = ''; // 恢復背景滾動
            }
            currentUnsubscribeBtn = null;
        }

        // 3. 執行真正的取消邏輯 (點擊彈窗中的「確認取消」按鈕時調用)
        async function executeUnsubscribe() {
            if (!currentUnsubscribeBtn) return;

            const btn = currentUnsubscribeBtn;
            const notificationId = btn.getAttribute('data-id');
            const confirmBtn = document.getElementById('confirmUnsubscribeBtn');

            // 按鈕進入 Loading 狀態
            const originalText = confirmBtn.innerHTML;
            confirmBtn.disabled = true;
            confirmBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 處理中...';

            try {
                const response = await fetch(`/api/stock-notification/unsubscribe-by-id/${notificationId}`, {
                    method: 'DELETE'
                });
                const result = await response.json();

                if (result.success) {
                    // 1. 關閉彈窗
                    closeUnsubscribeModal();

                    // 2. 顯示成功提示
                    showNotification('✅ 已取消訂閱');

                    // 3. 移除卡片動畫
                    const card = btn.closest('.notification-card');
                    if (card) {
                        card.style.transition = 'all 0.4s ease';
                        card.style.opacity = '0';
                        card.style.transform = 'scale(0.9)';

                        setTimeout(() => {
                            card.remove();

                            // 4. 更新計數
                            const grid = document.getElementById('notificationsGrid');
                            if (grid) {
                                const count = grid.children.length;
                                const totalCountEl = document.getElementById('totalCount');
                                if (totalCountEl) {
                                    totalCountEl.innerHTML = `共 ${count} 件商品`;
                                }

                                // 如果刪光了，刷新頁面顯示空狀態
                                if (count === 0) {
                                    setTimeout(() => location.reload(), 500);
                                }
                            } else {
                                location.reload();
                            }
                        }, 400); // 等待淡出動畫結束
                    }
                } else {
                    showNotification('❌ ' + result.message, true);
                    // 失敗時恢復按鈕
                    confirmBtn.disabled = false;
                    confirmBtn.innerHTML = originalText;
                }
            } catch (error) {
                console.error('取消訂閱錯誤:', error);
                showNotification('❌ 網絡錯誤，請稍後重試', true);
                // 報錯時恢復按鈕
                confirmBtn.disabled = false;
                confirmBtn.innerHTML = originalText;
            }
        }

        // 4. 點擊遮罩層也可以關閉彈窗
        document.getElementById('unsubscribeModal')?.addEventListener('click', function (e) {
            if (e.target === this) {
                closeUnsubscribeModal();
            }
        });

        // 5. 按 ESC 鍵關閉彈窗
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                const modal = document.getElementById('unsubscribeModal');
                if (modal && modal.style.display === 'flex') {
                    closeUnsubscribeModal();
                }
            }
        });

        // 點擊查看詳情時，異步清除 stock_notification 記錄
        function clearStockNotification(event, productId) {
            if (typeof isLoggedIn !== 'undefined' && isLoggedIn) {
                const url = `/api/stock-notification/clear-on-view/${productId}`;
                fetch(url, {method: 'DELETE', keepalive: true, credentials: 'same-origin'})
                    .catch(err => console.error('清除到貨通知記錄失敗:', err));
            }
        }
    </script>
</body>
