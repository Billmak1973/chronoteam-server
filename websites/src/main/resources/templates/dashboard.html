<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>個人中心 - ChronoTeam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <style>
        .dashboard-container {
            display: flex;
            min-height: calc(100vh - 150px);
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1rem;
            gap: 2rem;
        }

        .main-content {
            flex: 1;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 2.5rem;
        }

        .main-content.full-width {
            flex: 1;
            max-width: 100%;
        }

        .dashboard-container.guest-mode {
            justify-content: center;
        }

        /* 隱私保護卡片樣式 */
        .privacy-card {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--gray);
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            border: 2px dashed #e9ecef;
            border-radius: 16px;
            margin-top: 2rem;
        }

        .privacy-card i {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            color: var(--gold);
        }

        .privacy-card h3 {
            color: var(--primary);
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
        }

        .privacy-card p {
            margin-bottom: 2rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/common :: navbar}"></div>

    <div class="dashboard-container" th:classappend="${viewMode == 'guest' and !isSelf} ? 'guest-mode' : ''">
        <!-- 只有自己或特定模式下才顯示側邊欄 -->
        <div th:if="${viewMode != 'guest' or isSelf}"
            th:replace="~{fragments/sidebar :: sidebar(activePage='dashboard')}"></div>

        <main class="main-content" th:classappend="${viewMode == 'guest' and !isSelf} ? 'full-width' : ''">

            <!-- ========================================== -->
            <!-- 情況 1：本人訪問 (isSelf == true) -->
            <!-- ========================================== -->
            <div th:if="${isSelf}">
                <h1 style="margin-bottom: 1.5rem;">
                    <i class="fas fa-home" style="color: var(--gold); margin-right: 0.5rem;"></i>
                    歡迎來到個人中心
                </h1>
            </div>

            <!-- ========================================== -->
            <!-- 情況 2：訪客訪問他人主頁 (isSelf == false) -->
            <!-- ========================================== -->
            <div th:unless="${isSelf}">
                <h1 style="margin-bottom: 1.5rem;">
                    <i class="fas fa-user-circle" style="color: var(--gold); margin-right: 0.5rem;"></i>
                    <span th:text="${user.username}">User</span> 的主頁
                </h1>

                <div class="privacy-card">
                    <i class="fas fa-shield-alt"></i>
                    <h3>隱私保護</h3>
                    <p>
                        為保護用戶隱私，該用戶的<strong>購物記錄、收藏及瀏覽歷史</strong>等敏感資訊，<br>
                        <strong style="color: var(--primary);">僅對其本人可見</strong>。
                    </p>
                    <div style="display: flex; gap: 1rem; justify-content: center;">
                        <a href="/browse" class="btn btn-primary">
                            <i class="fas fa-search"></i> 瀏覽商品
                        </a>
                        <button onclick="history.back()" class="btn btn-outline">
                            <i class="fas fa-arrow-left"></i> 返回上一頁
                        </button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <div th:replace="~{fragments/common :: modals}"></div>
    <script src="/js/common.js"></script>
    <script th:inline="javascript">
        const isLoggedIn = [[${#authorization.expression('isAuthenticated()')} ?: false]];
    </script>
</body>

</html>
